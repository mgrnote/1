<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="robots" content="noindex">
<title>脱出ゲーム　猫のアジトから脱出</title>
<style>
/* stage.css — 3本（web・mail・firewall）で共有 */
:root{--ink:#1d2430;--sub:#5b6675;--card:rgba(255,255,255,.96);--accent:#2f6fd6;--accent2:#e2603c;--ok:#2aa35a;--ng:#d9463e;
  --pen:#2f6fd6;--mole:#9a6436;--cat:#4a4f5a;--dns:#7c5cd6;--web:#24476b;--mail:#e0503a;--line:rgba(27,35,48,.1);
  --pcw:clamp(270px,25vw,352px);}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;overflow:hidden;background:#dcecf6;font-family:"Yu Gothic UI","Hiragino Sans","Noto Sans JP",sans-serif;color:var(--ink);}
button,input,textarea,select{font-family:inherit;}
#host{position:fixed;inset:0;}
#host canvas{display:block;width:100%;height:100%;touch-action:none;}
#host canvas.pick{cursor:pointer;} #host canvas.drag{cursor:grabbing;}
#nogl{display:none;position:fixed;inset:0;align-items:center;justify-content:center;background:#fff;font-weight:800;padding:20px;text-align:center;z-index:60;}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:3;}
#labels .lb{position:absolute;left:0;top:0;white-space:nowrap;will-change:transform;}

/* ---- 上のバー ---- */
#top{position:fixed;left:0;right:0;top:0;height:50px;display:flex;align-items:center;gap:8px;padding:0 10px;z-index:8;
  background:rgba(255,255,255,.9);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);box-shadow:0 2px 10px rgba(0,0,0,.05);}
#top .brand{font-weight:900;font-size:15px;white-space:nowrap;display:flex;align-items:center;gap:6px;}
#top .brand small{font-size:10.5px;font-weight:800;color:#fff;background:var(--accent);border-radius:999px;padding:2px 8px;}
#chips{flex:1;min-width:0;display:flex;gap:4px;overflow:hidden;padding:4px 2px;align-items:center;}  /* スクロールしないで全部見える（2026-10-15 ユーザー指定）。せまいときは文字を詰めて省略 */
#chips .sep{font-size:10.5px;font-weight:800;color:#8a94a2;white-space:nowrap;margin-left:4px;}
.chip{flex:0 1 auto;min-width:0;border:1.5px solid #d3dbe5;background:#fff;border-radius:999px;padding:5px 9px 5px 5px;font-size:clamp(10.5px,0.95vw,12.5px);font-weight:800;color:#3a4350;cursor:pointer;display:flex;align-items:center;gap:5px;white-space:nowrap;transition:transform .12s;}
.chip .lb{overflow:hidden;min-width:0;white-space:nowrap;text-overflow:ellipsis;}  /* 2行に折らない（2026-10-16 ユーザー指定）。入りきらないときは番号だけにする（fitChips） */
.chip.nolb{flex:none;padding-right:5px;} .chip.nolb .lb{display:none;}
.chip .no{flex:none;}
.chip:hover{transform:translateY(-2px);}
.chip .no{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;border-radius:999px;background:#eef2f7;font-size:11px;color:#556;padding:0 4px;}
.chip.seen .no{background:#d9f2e3;color:#1f7a44;}
.chip.seen .no::after{content:"✓";margin-left:2px;}
.chip.on{border-color:var(--accent);background:#eaf1fd;color:#1d4ea6;box-shadow:0 2px 0 #c9d9f6;}
.chip.on .no{background:var(--accent);color:#fff;}
.chip.q{border-style:dashed;} .chip.q .no{background:#fde6cf;color:#a3501b;}
.chip.free .no{background:#ffe9a8;color:#7a5a00;}
#top .tools{display:flex;gap:5px;align-items:center;}
.tbtn{border:1.5px solid #d3dbe5;background:#fff;border-radius:10px;height:34px;min-width:34px;padding:0 9px;font-size:12.5px;font-weight:800;color:#3a4350;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap;}
select.tbtn{appearance:auto;-webkit-appearance:auto;padding:0 4px 0 7px;font-family:inherit;}
.tbtn svg{width:17px;height:17px;}
.tbtn.off{color:#a0a8b4;}
.tbtn:active{transform:translateY(1px);}

/* ---- パソコンの画面（左右） ---- */
.pc{position:fixed;top:60px;width:var(--pcw);z-index:6;background:#2a2f38;border-radius:14px;padding:6px;box-shadow:0 10px 28px rgba(0,0,0,.22);}
.pc.l{left:10px;} .pc.r{right:10px;}
.pc .who{display:flex;align-items:center;gap:6px;color:#e8edf4;font-size:12px;font-weight:800;padding:2px 6px 6px;}
.pc .who .ic{font-size:16px;}
.pc .who .ip{margin-left:auto;font-size:10.5px;font-weight:700;color:#9fb0c6;font-family:Consolas,monospace;}
.pc .scr{background:#fff;border-radius:8px;overflow:hidden;height:clamp(210px,37vh,300px);display:flex;flex-direction:column;position:relative;}
.pc .scr{transition:max-height .26s cubic-bezier(.2,.8,.2,1),opacity .2s ease-out;max-height:60vh;}
.pc.shut .scr{max-height:0;opacity:0;pointer-events:none;}
.pc.shut{padding-bottom:0;}
.pc.shut .who{padding-bottom:4px;}
.pcbtn{margin-left:6px;border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.12);color:#fff;border-radius:7px;font-size:11px;font-weight:800;padding:2px 8px;cursor:pointer;white-space:nowrap;}
.pcbtn:hover{background:rgba(255,255,255,.24);}
.pc.shut .pcbtn{background:#ffd84d;color:#3a2e00;border-color:#ffd84d;}
.pc.lit .scr{box-shadow:0 0 0 3px #ffd84d;}
.tabs{display:flex;gap:2px;background:#e9edf2;padding:4px 4px 0;}
.tabs button{border:0;background:transparent;border-radius:7px 7px 0 0;font-size:11.5px;font-weight:800;padding:4px 10px;color:#5b6675;cursor:pointer;}
.tabs button.on{background:#fff;color:#1d2430;}
.view{flex:1;overflow:auto;position:relative;font-size:12px;}
.addr{display:flex;align-items:center;gap:4px;padding:5px 6px;border-bottom:1px solid #e3e8ee;background:#fff;}
.addr .bar{flex:1;display:flex;align-items:center;gap:3px;background:#f1f4f8;border-radius:999px;padding:3px 9px;font-family:Consolas,monospace;font-size:11.5px;min-height:24px;overflow:hidden;white-space:nowrap;}
.addr .bar .lk{font-size:11px;}
.addr .bar .sc{color:#8a94a2;} .addr .bar .dm{color:#1d2430;font-weight:700;} .addr .bar .pt{color:#8a94a2;}
.addr .bar.hl-sc .sc,.addr .bar.hl-dm .dm,.addr .bar.hl-pt .pt{background:#fff3a8;border-radius:4px;color:#1d2430;box-shadow:0 0 0 2px #ffd84d;}
.caret::after{content:"";display:inline-block;width:1.5px;height:12px;background:#1d2430;margin-left:1px;vertical-align:-2px;animation:blink .75s step-end infinite;}
@keyframes blink{50%{opacity:0;}}
.addr input{flex:1;border:0;background:#f1f4f8;border-radius:999px;padding:4px 9px;font-family:Consolas,monospace;font-size:11.5px;min-width:0;}
.addr .go{border:0;background:var(--accent);color:#fff;font-weight:800;border-radius:999px;padding:3px 9px;font-size:11px;cursor:pointer;}
.page{padding:8px 10px;}
.page h3{margin:0 0 4px;font-size:15px;}
.page .hero{border-radius:8px;padding:5px 8px;color:#fff;font-weight:900;font-size:13.5px;display:flex;align-items:center;gap:8px;margin-bottom:5px;}
.page .hero .em{font-size:22px;line-height:1;}
.page p{margin:2px 0;line-height:1.5;}
.page a{color:#1a5fd0;text-decoration:underline;font-weight:800;cursor:pointer;}
.page a.hl{background:#fff3a8;box-shadow:0 0 0 3px #ffd84d;border-radius:3px;}
.page.empty{display:flex;align-items:center;justify-content:center;height:100%;color:#9aa2ad;font-weight:800;text-align:center;}
.loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;background:rgba(255,255,255,.92);font-weight:800;color:#5b6675;font-size:12px;}
.loading .sp{width:22px;height:22px;border-radius:50%;border:3px solid #dfe5ec;border-top-color:var(--accent);animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
pre.src{margin:0;padding:8px 10px;font-family:Consolas,monospace;font-size:11px;line-height:1.5;color:#334;background:#f8fafc;white-space:pre-wrap;}
pre.src .tg{color:#b04a1d;} pre.src .at{color:#1a5fd0;}
.mini{font-size:10.5px;color:#7a8794;font-weight:700;}
.btnrow{display:flex;gap:4px;flex-wrap:wrap;padding:5px 6px;border-bottom:1px solid #eef1f5;background:#fafbfd;}
.btnrow button,.sbtn{border:1.5px solid #d3dbe5;background:#fff;border-radius:8px;padding:3px 8px;font-size:11px;font-weight:800;color:#3a4350;cursor:pointer;}
.btnrow button.on{border-color:var(--accent);background:#eaf1fd;color:#1d4ea6;}
.btnrow button.pri,.sbtn.pri{background:var(--accent);border-color:var(--accent);color:#fff;}
body:not(.freemode) .pc .scr button,body:not(.freemode) .pc .scr input,body:not(.freemode) .pc .scr a,body:not(.freemode) .pc .scr textarea{pointer-events:none;}
body:not(.freemode) .pc .scr .btnrow{opacity:.75;}
body.busy .pc .scr button{opacity:.55;}
.pc .demo{position:absolute;right:6px;bottom:6px;font-size:10px;font-weight:800;color:#fff;background:rgba(29,36,48,.55);border-radius:999px;padding:2px 8px;pointer-events:none;}
body.freemode .pc .demo{display:none;}
/* メール */
.mform{padding:6px 8px;display:flex;flex-direction:column;gap:4px;}
.mform .row{display:flex;align-items:center;gap:5px;font-size:11.5px;}
.mform .row label{width:34px;color:#7a8794;font-weight:800;flex:none;}
.mform .row .v,.mform .row input{flex:1;border:1px solid #dfe5ec;border-radius:6px;padding:3px 6px;min-height:22px;font-family:Consolas,monospace;font-size:11.5px;background:#fff;}
.mform .body{border:1px solid #dfe5ec;border-radius:6px;padding:5px 7px;min-height:44px;font-size:11.5px;line-height:1.5;background:#fff;}
.mlist{display:flex;flex-direction:column;}
.mlist .m{display:flex;gap:6px;align-items:center;padding:6px 8px;border-bottom:1px solid #eef1f5;}
.mlist .m .f{font-size:16px;}
.mlist .m b{font-size:11.5px;} .mlist .m small{display:block;color:#7a8794;font-size:10.5px;}
.mlist .m.unread b::before{content:"●";color:var(--accent);margin-right:3px;font-size:9px;}
.mlist .m.new{animation:newm 1.2s ease-out;}
@keyframes newm{from{background:#fff3a8;}to{background:#fff;}}
.where{font-size:10.5px;font-weight:800;padding:4px 8px;background:#f1f4f8;color:#5b6675;line-height:1.45;}
.where b{color:var(--ink);}
.phone{position:absolute;right:8px;bottom:8px;width:124px;border-radius:14px;background:#1b2029;padding:5px;box-shadow:0 6px 16px rgba(0,0,0,.3);z-index:2;}
.phone .ps{background:#fff;border-radius:9px;min-height:66px;font-size:10px;overflow:hidden;}
.phone .ph{font-size:9.5px;font-weight:800;color:#fff;text-align:center;padding-bottom:3px;}

/* ---- 字幕（下） ---- */
/* 横長・低め（2026-10-15 ユーザー指定「横はめいっぱい、上下はせまく、3Dを広く」）：本文の右にボタン */
#cap{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);width:min(1500px,calc(100vw - 24px));z-index:9;
  background:#1d2430;color:#fff;border-radius:14px;padding:6px 12px 7px 16px;box-shadow:0 12px 30px rgba(0,0,0,.25);display:none;
  grid-template-columns:minmax(0,1fr) auto;column-gap:18px;align-items:center;}
#cap.on{display:grid;}
#capTi{grid-column:1 / -1;}
#capTi{font-size:11.5px;font-weight:800;color:#9fb0c6;display:flex;align-items:center;gap:6px;}
#capTi .no{background:#e2603c;color:#fff;border-radius:999px;padding:1px 7px;font-size:11px;}
#capTi .k{margin-left:auto;font-family:Consolas,monospace;}
#capTx{font-size:clamp(14px,1.3vw,17px);font-weight:800;line-height:1.5;margin:2px 0 0;min-height:1.5em;}
#capTx .line{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}  /* 1行（fitCap が文字を小さくして収める） */
#capTx b{color:#ffd84d;}
#capTx .term{}  /* プリントの穴埋めのキーワードは強調しない（2026-10-15 ユーザー指定） */
#capTx .pen{color:#8ec2ff;} #capTx .mole{color:#e8b98a;} #capTx .cat{color:#ff9a9a;}
#capTx small{font-size:.8em;color:#c4cfdc;font-weight:700;}
#capBt{display:flex;align-items:center;gap:6px;}
#capBt button{border:0;border-radius:10px;padding:7px 12px;font-size:13px;font-weight:800;cursor:pointer;background:#2f3846;color:#e8edf4;}
#capBt button:disabled{opacity:.35;cursor:default;}
#capDots{display:flex;gap:5px;margin:0 4px;flex:none;}
#capDots i{width:8px;height:8px;border-radius:999px;background:#4a5566;}
#capDots i.was{background:#8a96a8;} #capDots i.on{background:#e2603c;width:20px;}
#bNext{background:linear-gradient(180deg,#3d80e6,#2f6fd6)!important;color:#fff!important;box-shadow:0 3px 0 #24559f;padding:8px 16px!important;}
#bNext b{color:#ffd84d;}
#cap.playing #capTi::after{content:"Enter・クリックで動きをとばす";font-size:10.5px;color:#6f7c8e;margin-left:6px;}

/* ---- トースト・カード ---- */
#toast{position:fixed;left:50%;top:62px;transform:translateX(-50%);z-index:30;background:#1d2430;color:#fff;font-weight:800;font-size:13.5px;border-radius:12px;padding:8px 16px;display:none;max-width:min(560px,92vw);text-align:center;}
#toast.on{display:block;} #toast.ok{background:var(--ok);} #toast.ng{background:var(--ng);}
#card{position:fixed;left:50%;top:64px;transform:translateX(-50%);width:min(560px,calc(100vw - 2*var(--pcw) - 40px));min-width:380px;max-height:calc(100vh - 250px);overflow:auto;z-index:20;
  background:#fff;border-radius:16px;padding:12px 14px;box-shadow:0 16px 40px rgba(0,0,0,.25);display:none;}
#card.on{display:block;}
#card .qh{font-size:12px;font-weight:900;color:#a3501b;margin-bottom:6px;}
#card .qq{font-size:14px;font-weight:800;line-height:1.6;margin-bottom:8px;}
#card .qc{display:flex;flex-direction:column;gap:6px;}
#card .qc button{display:flex;gap:8px;align-items:flex-start;text-align:left;border:1.5px solid #d3dbe5;background:#fff;border-radius:10px;padding:7px 10px;font-size:13px;font-weight:700;line-height:1.5;cursor:pointer;color:var(--ink);}
#card .qc button:hover:not(:disabled){border-color:var(--accent);transform:translateY(-1px);}
#card .qc button .n{font-weight:900;color:var(--accent);}
#card .qc button.ok{border-color:var(--ok);background:#e6f6ec;}
#card .qc button.ng{border-color:var(--ng);background:#fdeaea;}
#card .qc button:disabled{cursor:default;}
#card .qr{margin-top:8px;font-size:13px;font-weight:800;line-height:1.6;border-radius:10px;padding:8px 10px;}
#card .qr.ok{background:#e6f6ec;color:#1f6b3d;} #card .qr.ng{background:#fdeaea;color:#8a2a24;}
#card .qr .go{margin-top:6px;border:0;border-radius:10px;padding:7px 14px;font-weight:900;font-size:13px;background:var(--accent);color:#fff;cursor:pointer;}
#card .terms{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
#card .tm{border:1.5px solid #e3e8ee;border-radius:10px;padding:6px 8px;font-size:12px;}
#card .tm .b{display:block;font-weight:900;font-size:14px;color:#a0a8b4;}
#card .tm.on .b{color:#c0392b;}
#card .tm .d{color:#5b6675;font-weight:700;}
#card .cb{display:flex;justify-content:flex-end;gap:6px;margin-top:10px;}
#card .cb button{border:0;border-radius:10px;padding:7px 14px;font-weight:800;font-size:13px;background:#eef2f7;cursor:pointer;}
#card table{border-collapse:collapse;width:100%;font-size:12px;margin:4px 0;}
#card th,#card td{border:1px solid #dfe5ec;padding:4px 6px;text-align:center;}
#card th{background:#f1f4f8;}
#card tr.hl td{background:#fff3a8;}

/* ---- 3D の上の札 ---- */
.lb.nm{background:rgba(255,255,255,.95);border-radius:9px;padding:3px 9px;font-size:11.5px;line-height:1.3;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.12);border:1.5px solid rgba(0,0,0,.06);}
.lb.nm b{display:block;font-size:12px;}
.lb.nm small{display:block;font-family:Consolas,monospace;font-size:10.5px;color:#5b6675;font-weight:700;}
.lb.nm .dm{color:#1d4ea6;} .lb.nm .ipn{color:#a3501b;}
.lb.nm.hl{border-color:#ffd84d;box-shadow:0 0 0 3px #ffd84d,0 4px 12px rgba(0,0,0,.18);}
.lb.nm table{border-collapse:collapse;margin-top:3px;font-size:10.5px;font-family:Consolas,monospace;}
.lb.nm td{border:1px solid #e3e8ee;padding:1px 5px;text-align:left;}
.lb.nm tr.hl td{background:#fff3a8;font-weight:800;}
.lb.pk{background:#fff;border-radius:8px;padding:3px 8px;font-size:11px;font-weight:800;line-height:1.35;box-shadow:0 3px 10px rgba(0,0,0,.18);border-left:4px solid var(--accent);text-align:left;}
.lb.pk.res{border-left-color:var(--ok);} .lb.pk.dns{border-left-color:var(--dns);} .lb.pk.mail{border-left-color:var(--mail);} .lb.pk.bad{border-left-color:#d9463e;background:#fff3f3;}
.lb.pk .h{display:block;font-size:9.5px;color:#7a8794;font-weight:800;}
.lb.pk .sec{font-family:Consolas,monospace;letter-spacing:.02em;}
.lb.pk .scr{font-family:Consolas,monospace;color:#7a8794;}
.lb.pk .hd{display:inline-block;border-radius:4px;padding:0 4px;margin-right:3px;font-size:10px;}
.lb.pk .ip{background:#dce8fd;color:#1d4ea6;} .lb.pk .tcp{background:#fde6cf;color:#a3501b;}
.lb.pk.big{font-size:12.5px;padding:6px 10px;}
.lb.bub{background:#fff;border-radius:14px;padding:5px 11px;font-size:12.5px;font-weight:800;box-shadow:0 4px 12px rgba(0,0,0,.15);max-width:230px;white-space:normal;text-align:center;line-height:1.45;}
.lb.bub::after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:#fff;}
.lb.tag{background:#1d2430;color:#fff;border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:900;}
.lb.tag.ok{background:var(--ok);} .lb.tag.ng{background:var(--ng);} .lb.tag.y{background:#ffd84d;color:#1d2430;}
.lb.urlp{background:#fff;border-radius:10px;padding:6px 12px;font-family:Consolas,monospace;font-size:16px;transition:opacity .3s;font-weight:800;box-shadow:0 4px 12px rgba(0,0,0,.15);border:2px solid #ffd84d;}
.lb.urlp small{display:block;font-family:inherit;font-size:10.5px;color:#7a8794;}

/* ---- スタート ---- */
#start{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:16px;
  background:linear-gradient(160deg,rgba(234,244,251,.95) 0%,rgba(220,236,246,.88) 50%,rgba(213,231,210,.88) 100%);transition:opacity .35s;}
#start.off{opacity:0;pointer-events:none;}
#start .in{text-align:center;max-width:min(700px,94vw);}
#start .tag{display:inline-block;font-size:12px;font-weight:800;color:var(--accent);background:#e8f0fd;border-radius:999px;padding:4px 12px;}
#start .ttl{font-size:clamp(30px,6vw,50px);font-weight:900;letter-spacing:.04em;line-height:1.2;margin-top:10px;}
#start .ttl em{font-style:normal;color:var(--accent);}
#start p{font-size:clamp(13px,2.3vw,15.5px);font-weight:700;color:#38424f;line-height:1.8;margin:14px 0 4px;}
#start p b{color:var(--accent2);}
#start .cast{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:12px;}
#start .cast span{background:#fff;border-radius:12px;padding:6px 12px;font-size:13px;font-weight:800;box-shadow:0 2px 8px rgba(0,0,0,.08);}
#startBtn{margin-top:20px;border:0;border-radius:16px;background:linear-gradient(180deg,#3d80e6,#2f6fd6);color:#fff;font-size:clamp(17px,3.2vw,22px);font-weight:900;padding:14px 44px;cursor:pointer;box-shadow:0 6px 0 #24559f,0 12px 26px rgba(0,0,0,.18);}
#startBtn:active{transform:translateY(3px);box-shadow:0 3px 0 #24559f;}
#start .hint{margin-top:14px;font-size:12px;font-weight:700;color:#7a8794;line-height:1.7;}

@media (max-width:1100px){ :root{--pcw:clamp(240px,27vw,300px);} #cap{min-width:340px;} }
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important;} }

/* ---- カメラ ---- */
#vig{position:fixed;inset:0;pointer-events:none;z-index:2;background:radial-gradient(ellipse 75% 70% at 50% 55%,rgba(0,0,0,0) 62%,rgba(20,30,45,.18) 100%);}
#camBack{position:fixed;left:50%;top:58px;transform:translateX(-50%);z-index:7;display:none;align-items:center;gap:8px;background:rgba(29,36,48,.92);color:#fff;border-radius:999px;padding:5px 6px 5px 14px;font-size:13px;font-weight:800;box-shadow:0 6px 16px rgba(0,0,0,.2);white-space:nowrap;}
#camBack.on{display:flex;}
#camBack button{border:0;border-radius:999px;background:#ffd84d;color:#1d2430;font-weight:900;font-size:12.5px;padding:5px 12px;cursor:pointer;}
.tbtn.cam.on{background:#eaf1fd;border-color:var(--accent);color:#1d4ea6;}
.tbtn.cam.off{color:#7a8794;}
#toast{top:102px;}

/* ---- 蛍光の縁どりをしている名札（1本目イエロー・2本目シアン） ---- */
.lb.nm.spot{border-color:#ffd84d;box-shadow:0 0 0 3px #ffd84d,0 0 22px 6px rgba(255,216,77,.75);animation:spotlb 1.4s ease-in-out infinite;}
@keyframes spotlb{50%{box-shadow:0 0 0 3px #ffd84d,0 0 32px 10px rgba(255,216,77,.95);}}
.lb.nm.spot2{border-color:#2ef2ff;box-shadow:0 0 0 3px #2ef2ff,0 0 22px 6px rgba(46,242,255,.7);animation:spotlb2 1.4s ease-in-out infinite;}
@keyframes spotlb2{50%{box-shadow:0 0 0 3px #2ef2ff,0 0 32px 10px rgba(46,242,255,.9);}}

/* 上のバーがせまいときはボタンの言葉を省いて、キーワードの場所を空ける */
@media (max-width:1200px){ .tbtn .tw{display:none;} }
/* パソコン画面のタイトルバーは1行に（せまいときは IP を省略） */
.pc .who{white-space:nowrap;min-width:0;}
.pc .who .ip{overflow:hidden;text-overflow:ellipsis;min-width:0;}
/* オープニングをとばす（オープニングの間だけ、字幕の右はし） */
#bSkipIntro{display:none;background:#fff!important;color:#3a4350!important;border:1.5px solid #c9d2de!important;font-size:12px!important;}
#bSkipIntro.on{display:block;}
#bSkipIntro:hover{background:#f1f4f8!important;}

/* ==== ブラウザと ペンギン高校のホームページ（①web・③firewall で使う） ==== */
.bt{display:flex;align-items:flex-end;gap:2px;background:#dee3e9;padding:5px 6px 0;flex:none;}
.bt .tab{display:flex;align-items:center;gap:5px;background:#fff;border-radius:8px 8px 0 0;padding:4px 8px;font-size:11px;font-weight:700;color:#3a4350;max-width:78%;min-width:0;}
.bt .tab .tt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bt .tab .x{color:#9aa2ad;margin-left:6px;font-size:9px;}
.bt .tab .fv{width:14px;height:14px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;flex:none;}
.bt .tab .fv.spin{border-radius:50%;border:2px solid #cfd7e2;border-top-color:var(--accent);animation:spin .8s linear infinite;}
.bt .nt{color:#5b6675;font-size:13px;padding:0 6px 4px;}
.addr{flex:none;}
.addr .bar{font-size:10.5px;padding:3px 7px;}   /* 文化祭のページの URL が最後まで見えるように */
.addr .nv{color:#8a94a2;font-size:13px;width:16px;text-align:center;flex:none;}
.addr .bar .ph{color:#9aa2ad;font-family:"Yu Gothic UI",sans-serif;font-weight:700;}
.addr .bar .ns{color:#c0392b;font-family:"Yu Gothic UI",sans-serif;font-size:10.5px;font-weight:800;margin-right:4px;white-space:nowrap;}
.addr .bar .lk{margin-right:2px;}
.view{background:#fff;}
.view.dim .site,.view.dim pre{opacity:.45;}
.prog{position:sticky;left:0;right:0;top:0;height:3px;overflow:hidden;margin-bottom:-3px;z-index:1;}
.prog::before{content:"";position:absolute;top:0;height:3px;width:40%;background:var(--accent);animation:prog 1.1s ease-in-out infinite;}
@keyframes prog{from{left:-40%;}to{left:100%;}}
.stat{position:absolute;left:0;bottom:0;max-width:92%;background:#f1f4f8;border:1px solid #d3dbe5;border-left:0;border-bottom:0;border-radius:0 7px 0 0;font-size:10.5px;padding:2px 9px;color:#3a4350;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ntp{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#9aa2ad;font-weight:800;text-align:center;font-size:11.5px;line-height:1.6;}
.ntp .g{font-size:30px;}
/* ---- ペンギン高校のホームページ ---- */
.site{font-size:11.5px;color:#1d2430;min-height:100%;display:flex;flex-direction:column;}
.site .sh{display:flex;align-items:center;gap:7px;padding:6px 10px;border-bottom:3px solid #2f6b4f;}
.site .logo{width:28px;height:28px;border-radius:50%;background:#2f6b4f;display:flex;align-items:center;justify-content:center;font-size:16px;flex:none;}
.site .sh b{display:block;font-size:13.5px;letter-spacing:.06em;color:#234f3a;}
.site .sh small{display:block;font-size:8px;color:#7a8794;letter-spacing:.16em;font-weight:700;}
.site .sv{margin-left:auto;font-size:9.5px;color:#7a8794;border:1px solid #d3dbe5;border-radius:999px;padding:1px 7px;white-space:nowrap;}
.site .nav{display:flex;background:#2f6b4f;}
.site .nav span{flex:1;text-align:center;color:#fff;font-size:10px;font-weight:800;padding:4px 0;border-right:1px solid rgba(255,255,255,.22);white-space:nowrap;}
.site .nav span:last-child{border-right:0;background:#3f8a66;}
.site .hero2{margin:6px 8px 4px;border-radius:7px;min-height:56px;background:linear-gradient(120deg,#7cc4e8,#bfe6c9);display:flex;align-items:center;justify-content:space-between;padding:4px 12px;font-weight:900;color:#1f4a35;font-size:14px;}
.site .hero2 small{display:block;font-size:9px;letter-spacing:.2em;color:#2f6b4f;}
.site .hero2 .pic{font-size:30px;}
.site .news{margin:2px 8px 6px;}
.site .news .hd{font-weight:900;font-size:11.5px;border-left:4px solid #2f6b4f;padding-left:6px;margin:4px 0 2px;}
.site .news .r{display:flex;gap:8px;padding:3px 0;border-bottom:1px dotted #cfd7e2;align-items:baseline;}
.site .news .r i{font-style:normal;color:#7a8794;font-family:Consolas,monospace;font-size:10.5px;flex:none;}
.site a{color:#1a5fd0;text-decoration:underline;font-weight:800;cursor:pointer;}
.site a.hl{background:#fff3a8;box-shadow:0 0 0 3px #ffd84d;border-radius:3px;}
.site .crumb{font-size:9.5px;color:#7a8794;padding:4px 10px;background:#f4f7f5;}
.site .art{padding:5px 10px 6px;}
.site .art .h1{font-size:13.5px;font-weight:900;color:#234f3a;border-bottom:2px solid #cfe3d6;padding-bottom:3px;margin-bottom:5px;}
.site .art p{margin:3px 0;line-height:1.55;}
.site .fes{display:flex;align-items:center;gap:10px;background:#fff6e0;border-radius:8px;padding:5px 10px;font-weight:900;color:#a3501b;}
.site .fes span{font-size:24px;}
.site .lf{display:flex;align-items:center;gap:6px;margin:4px 0;}
.site .lf label{width:58px;font-size:10.5px;color:#5b6675;font-weight:800;}
.site .lf .in{flex:1;border:1px solid #c9d2dc;border-radius:5px;min-height:22px;padding:2px 7px;font-family:Consolas,monospace;font-size:12px;}
.site .lb2{margin:6px 0 0 64px;display:inline-block;background:#2f6b4f;color:#fff;font-weight:900;border-radius:6px;padding:3px 16px;font-size:11px;}
.site .okm{margin:6px 0 0 64px;color:#1f7a44;font-weight:900;}
.site .ft{margin-top:auto;background:#234f3a;color:#d8eee2;font-size:9.5px;padding:5px 10px;line-height:1.5;}

/* ==== 「やってみる」の下のボタン（2026-10-16 ユーザー指定） ==== */
#capTx .acts{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 2px;}
#capTx .act{border:0;border-radius:12px;padding:8px 14px;font-size:clamp(13px,1.15vw,15px);font-weight:900;cursor:pointer;background:#2f3846;color:#fff;box-shadow:0 3px 0 #161b22;font-family:inherit;}
#capTx .act.pri{background:linear-gradient(180deg,#ffb84d,#f08c1e);color:#2a1a00;box-shadow:0 3px 0 #b5620c;padding:9px 20px;font-size:clamp(14px,1.3vw,17px);}
#capTx .act:hover{transform:translateY(-1px);}
#capTx .act:active{transform:translateY(2px);box-shadow:none;}
body.busy #capTx .act{opacity:.45;cursor:wait;}
#capTx .act.on{background:#e2603c;}
.chip.free{border-color:#f0a33c;background:#fff8ec;}
.chip.free.on{border-color:#f08c1e;background:#ffedd2;color:#7a4300;box-shadow:0 2px 0 #f5cf98;}
.chip.free .no{background:#f08c1e;color:#fff;}
.chip.free.seen .no::after{content:"";margin:0;}
.chip.free{flex:none;} .chip.free .lb{white-space:nowrap;}   /* 「やってみる」は折らない */
/* せまい画面：説明文を1行のまま読めるよう、ボタンは文の下の段へ（2026-10-16） */
@media (max-width:980px){ #cap{grid-template-columns:minmax(0,1fr);} #capBt{justify-content:flex-end;margin-top:2px;} }

/* ==== ①のブラウザ：いろいろなホームページ（2026-10-16 ユーザー指定） ==== */
.bmk{display:flex;gap:2px;padding:2px 6px 3px;background:#fff;border-bottom:1px solid #e3e8ee;flex:none;overflow:hidden;white-space:nowrap;}
.bmk span{font-size:10px;font-weight:800;color:#3a4350;padding:1px 7px;border-radius:999px;cursor:pointer;}
.bmk span:hover{background:#eef2f7;}
.addr .bar.ed{cursor:text;box-shadow:inset 0 0 0 1px #c9d2dc;}
.addr .bar.ed:hover{box-shadow:inset 0 0 0 2px var(--accent);}
.addr input{font-size:10.5px!important;}
.addr .nv[data-back]{cursor:pointer;}
body.freemode .pc .scr [data-go],body.freemode .pc .scr [data-back],body.freemode .pc .scr .bar.ed{pointer-events:auto;}
.site .nav span{cursor:pointer;}
.site .nav span.cur{background:rgba(255,255,255,.22);}
.site a.hn{text-decoration:none;color:inherit;}
.site code,.err code{font-family:Consolas,monospace;background:#f1f4f8;border-radius:4px;padding:0 4px;font-size:10.5px;}
.site .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin:4px 8px 4px;}
.site .tiles.s{grid-template-columns:repeat(3,1fr);margin:4px 0;}
.site .tiles a,.site .tiles span{display:block;text-align:center;border:1px solid #d6e2da;border-radius:7px;padding:4px 2px;font-size:10px;line-height:1.35;text-decoration:none;color:#234f3a;background:#f6faf7;font-weight:800;}
.site .tiles span{color:#8a94a2;background:#fafbfc;border-style:dashed;}
.site .tiles a:hover{background:#e6f2ea;}
.site .kv{display:flex;gap:8px;padding:3px 0;border-bottom:1px dotted #cfd7e2;}
.site .kv span{width:70px;flex:none;color:#5b6675;font-weight:800;font-size:10.5px;}
.site .tb{border-collapse:collapse;width:100%;margin:3px 0;font-size:11px;}
.site .tb th,.site .tb td{border:1px solid #d6dde5;padding:3px 6px;text-align:left;}
.site .tb th{background:#f1f5f2;width:30%;white-space:nowrap;}
.site .mini{font-size:10px;color:#7a8794;}
.site .map{position:relative;height:84px;border-radius:8px;background:#e7efe2;overflow:hidden;margin:4px 0;}
.site .map .rd{position:absolute;left:0;right:0;top:48%;height:7px;background:#fff;}
.site .map .rd.v{left:46%;right:auto;top:0;bottom:0;width:7px;height:auto;}
.site .map .pin{position:absolute;font-size:17px;transform:translate(-50%,-50%);}
.site .fes.warn{background:#fff0ee;color:#b0301e;}
.err{padding:18px 14px;color:#3a4350;font-size:11.5px;line-height:1.6;}
.err .eg{font-size:30px;}
.err b{font-size:14px;display:block;margin:4px 0;}
.err .ec{font-family:Consolas,monospace;font-size:10px;color:#8a94a2;}
.err a{color:#1a5fd0;text-decoration:underline;font-weight:800;cursor:pointer;}
/* もぐら動物園（オレンジ） */
.site.zoo .sh{border-bottom-color:#c46a1b;} .site.zoo .logo{background:#c46a1b;} .site.zoo .sh b{color:#8a4510;}
.site.zoo .nav{background:#c46a1b;} .site.zoo .nav span:last-child{background:#d9832f;}
.site.zoo .hero2{background:linear-gradient(120deg,#ffd27a,#ffe9c2);color:#8a4510;} .site.zoo .hero2 small{color:#c46a1b;}
.site.zoo .news .hd{border-left-color:#c46a1b;} .site.zoo .art .h1{color:#8a4510;border-bottom-color:#f3d9bd;}
.site.zoo .tiles a{border-color:#f0d2b0;background:#fff8ef;color:#8a4510;} .site.zoo .tiles a:hover{background:#ffeed8;}
.site.zoo .crumb{background:#fff7ee;} .site.zoo .ft{background:#8a4510;color:#ffe9d2;} .site.zoo .ft a{color:#ffe08a;}
/* こおり市（青） */
.site.city .sh{border-bottom-color:#2f5fa8;} .site.city .logo{background:#2f5fa8;} .site.city .sh b{color:#1f3f73;}
.site.city .nav{background:#2f5fa8;} .site.city .nav span:last-child{background:#3f74c4;}
.site.city .hero2{background:linear-gradient(120deg,#a9d0ff,#e3f0ff);color:#1f3f73;} .site.city .hero2 small{color:#2f5fa8;}
.site.city .news .hd{border-left-color:#2f5fa8;} .site.city .art .h1{color:#1f3f73;border-bottom-color:#cfdcf3;}
.site.city .tiles a{border-color:#c9d8f0;background:#f3f7fd;color:#1f3f73;} .site.city .tiles a:hover{background:#e3edfb;}
.site.city .crumb{background:#f2f6fc;} .site.city .ft{background:#1f3f73;color:#dbe7fa;} .site.city .ft a{color:#ffe08a;}
.site .ft a{color:#ffe08a;}

/* ①脱出ゲームの画面（stage.css のあとに読む） */
body.esc #top{justify-content:space-between;}
#room{font-size:13px;font-weight:900;color:#3a4350;background:#fff;border:1.5px solid #d3dbe5;border-radius:999px;padding:4px 12px;}
#room b{color:#e2603c;}
#clock{font-family:Consolas,monospace;font-weight:900;font-size:14px;color:#3a4350;background:#fff;border:1.5px solid #d3dbe5;border-radius:999px;padding:4px 10px;}
.tbtn.hint{background:#fff7d6;border-color:#f0c94a;color:#7a5a00;font-weight:900;}
.tbtn.hint small{font-family:Consolas,monospace;margin-left:3px;color:#b08a00;}
/* 持ち物 */
#inv{position:fixed;left:10px;bottom:10px;z-index:9;background:rgba(29,36,48,.92);border-radius:14px;padding:6px 8px;display:flex;align-items:center;gap:8px;max-width:calc(100vw - 20px);}
#inv .ih{color:#c4cfdc;font-size:11.5px;font-weight:900;white-space:nowrap;}
#invList{display:flex;gap:6px;flex-wrap:wrap;}
#invList:empty::after{content:"なし";color:#7a8794;font-size:12px;font-weight:800;}
.it{display:flex;align-items:center;gap:5px;border:0;border-radius:10px;background:#fff;color:#1d2430;font-family:inherit;font-weight:900;font-size:12.5px;padding:5px 9px;cursor:pointer;box-shadow:0 2px 0 #9aa3ad;}
.it .ic{font-size:16px;}
.it.new{box-shadow:0 0 0 3px #ffd84d;}
/* 調べた結果のメッセージ（時間では消さない） */
#msg{position:fixed;left:50%;bottom:62px;transform:translateX(-50%);z-index:10;width:min(760px,calc(100vw - 24px));background:#1d2430;color:#fff;border-radius:14px;padding:10px 14px;box-shadow:0 12px 30px rgba(0,0,0,.25);display:none;}
#msg.on{display:block;}
#msgTx{font-size:clamp(14px,1.3vw,16.5px);font-weight:800;line-height:1.6;}
#msgTx b{color:#ffd84d;} #msgTx .pen{color:#8ec2ff;} #msgTx .cat{color:#ff9a9a;}
#msgBt{display:flex;gap:8px;justify-content:flex-end;margin-top:6px;}
#msgBt:empty{display:none;}
#msgBt button{border:0;border-radius:10px;padding:7px 14px;font-family:inherit;font-size:13.5px;font-weight:900;cursor:pointer;background:#2f6fd6;color:#fff;box-shadow:0 3px 0 #24559f;}
#msgBt button.sub{background:#3a4350;box-shadow:0 3px 0 #161b22;}
/* 近くにあるとき「調べる」 */
#near{position:fixed;left:50%;top:60px;transform:translateX(-50%);z-index:8;background:#fff;border:2px solid #ffd84d;border-radius:999px;padding:5px 14px;font-weight:900;font-size:13px;display:none;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.15);}
#near.on{display:block;}
#near kbd{font-family:Consolas,monospace;background:#1d2430;color:#fff;border-radius:6px;padding:1px 6px;font-size:11px;margin-left:4px;}
/* メモ帳（暗号を解く作業台） */
#memo{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(10,14,22,.45);}
#memo.on{display:flex;}
.mp{width:min(720px,calc(100vw - 24px));max-height:calc(100vh - 24px);overflow:auto;background:#fffdf6;border-radius:18px;padding:12px 16px 14px;box-shadow:0 18px 44px rgba(0,0,0,.35);position:relative;}
.mp .mh{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:900;margin-bottom:6px;}
.mp .mh .x{margin-left:auto;border:0;background:#e3e8ee;border-radius:10px;padding:5px 11px;font-family:inherit;font-weight:900;cursor:pointer;}
.mp .src{background:#fff;border:1.5px solid #e9dcc0;border-radius:12px;padding:8px 12px;margin-bottom:8px;}
.mp .src .lb2{font-size:11px;font-weight:900;color:#a3501b;}
.mp .src .ct{font-size:clamp(22px,3vw,30px);font-weight:900;letter-spacing:.12em;color:#6b3fc4;}
/* たぬきの絵を大きく（2026-10-21 ユーザー指定：絵を強調したい） */
.mp .src .pic{display:inline-block;font-size:clamp(64px,8vw,84px);line-height:1;margin-right:14px;vertical-align:middle;filter:drop-shadow(0 3px 4px rgba(0,0,0,.18));}
.mp .src .pic.flip{transform:rotate(180deg);}
.mp .src small{display:block;color:#7a8794;font-size:11.5px;font-weight:700;margin-top:2px;}
.mp .tool{background:#f2f5fa;border-radius:12px;padding:7px 10px;margin-bottom:8px;font-size:12.5px;font-weight:800;}
.mp .tool .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.mp .tool .prev{font-size:clamp(20px,2.6vw,26px);font-weight:900;letter-spacing:.12em;color:#1d2430;background:#fff;border-radius:10px;padding:2px 12px;min-width:6em;}
.mp .tool .dial{display:flex;align-items:center;gap:4px;}
.mp .tool .dial button{border:0;width:34px;height:34px;border-radius:999px;background:#1d2430;color:#fff;font-size:15px;font-weight:900;cursor:pointer;}
.mp .tool .dial .num{font-family:Consolas,monospace;font-size:22px;font-weight:900;min-width:2.2em;text-align:center;background:#fff;border-radius:8px;padding:1px 4px;}
.mp .tool .warn{color:#a92a24;font-weight:900;}
.mp .tool .big{font-family:Consolas,monospace;font-size:18px;color:#a92a24;}
.mp .tool .usekey{border:0;border-radius:10px;padding:7px 13px;font-family:inherit;font-weight:900;font-size:13.5px;background:#b8860b;color:#fff;cursor:pointer;box-shadow:0 3px 0 #7a5a08;}
.mp .slots{display:flex;gap:5px;justify-content:center;margin:4px 0 8px;}
.mp .slot{width:clamp(34px,4.6vw,46px);height:clamp(40px,5.2vw,52px);border-radius:10px;border:2px solid #c9d2dc;background:#fff;display:grid;place-items:center;font-size:clamp(20px,2.8vw,28px);font-weight:900;}
.mp .slot.cur{border-color:#2f6fd6;box-shadow:0 0 0 3px rgba(47,111,214,.2);}
.mp .slot.ok{border-color:#2aa35a;background:#eafaf0;}
.mp .pad{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;direction:rtl;}
.mp .pad .col{display:grid;grid-template-rows:repeat(5,1fr);gap:4px;direction:ltr;}
.mp .pad button{border:0;border-radius:8px;background:#fff;box-shadow:0 2px 0 #c9d2dc;font-family:inherit;font-size:clamp(14px,1.8vw,18px);font-weight:900;padding:5px 0;cursor:pointer;color:#1d2430;}
.mp .pad button:empty{visibility:hidden;}
.mp .pad button.hl{background:#fff3a8;box-shadow:0 2px 0 #f0c94a;}
.mp .pad button:active{transform:translateY(2px);box-shadow:none;}
.mp .padx{display:flex;gap:6px;justify-content:center;margin-top:6px;}
.mp .padx button{border:0;border-radius:10px;padding:7px 12px;font-family:inherit;font-weight:900;font-size:13.5px;cursor:pointer;background:#e3e8ee;color:#1d2430;}
.mp .padx .go{background:#e2603c;color:#fff;box-shadow:0 3px 0 #a3361b;padding:7px 18px;}
.mp .res{min-height:1.4em;text-align:center;font-weight:900;margin-top:6px;}
.mp .res.ng{color:#a92a24;} .mp .res.ok{color:#1f7a43;}
.mp .wheels{display:flex;gap:10px;justify-content:center;margin:8px 0;}
.mp .wh{display:flex;flex-direction:column;align-items:center;gap:4px;}
.mp .wh button{border:0;width:44px;height:30px;border-radius:9px;background:#1d2430;color:#fff;font-size:14px;cursor:pointer;}
.mp .wh .d{font-family:Consolas,monospace;font-size:34px;font-weight:900;width:52px;text-align:center;background:#20242c;color:#ffd84d;border-radius:10px;}
.mp .paper{background:#fff;border:1.5px solid #e9dcc0;border-radius:12px;padding:12px 14px;font-size:16px;font-weight:800;line-height:1.7;}
.mp .paper .h{font-size:12px;color:#a3501b;font-weight:900;}
.mp .paper b{color:#a92a24;}
.mp.tada{animation:tada 1s ease-out;}
@keyframes tada{0%{transform:scale(1);}15%{transform:scale(.94) rotate(-2deg);}40%{transform:scale(1.04) rotate(2deg);}60%{transform:scale(1.04) rotate(-1deg);}100%{transform:scale(1) rotate(0);}}
.mp.shake{animation:shk .54s cubic-bezier(.16,1,.3,1);}
@keyframes shk{0%,100%{translate:0;}20%{translate:-12px 0;}40%{translate:10px 0;}60%{translate:-6px 0;}80%{translate:4px 0;}}
.mp .slot.ng{animation:slotNg .54s ease-out;}
@keyframes slotNg{0%,60%{background:#ffe1de;border-color:#e8524a;color:#a92a24;}100%{}}
#ngFlash{position:fixed;inset:0;pointer-events:none;z-index:30;opacity:0;box-shadow:inset 0 0 0 10px rgba(240,70,60,.95),inset 0 0 140px rgba(240,70,60,.6);}
#ngFlash.on{animation:ngf .54s ease-out;}
@keyframes ngf{0%{opacity:0;}18%{opacity:1;}100%{opacity:0;}}
/* スタート・クリア */
body.esc #card{width:min(600px,calc(100vw - 24px));min-width:0;top:50%;transform:translate(-50%,-50%);max-height:calc(100vh - 40px);}
#card .big{font-size:24px;font-weight:900;margin:2px 0 8px;}
#card .lead{font-size:14.5px;font-weight:800;line-height:1.7;}
#card .ops{font-size:12.5px;font-weight:800;color:#5b6675;background:#f2f5fa;border-radius:10px;padding:7px 10px;margin:8px 0;line-height:1.7;}
#card .ops kbd{font-family:Consolas,monospace;background:#1d2430;color:#fff;border-radius:5px;padding:0 5px;font-size:11px;}
#card .stat{display:flex;gap:10px;justify-content:center;margin:8px 0;}
#card .stat div{background:#f2f5fa;border-radius:12px;padding:6px 14px;text-align:center;font-weight:900;font-size:20px;}
#card .stat small{display:block;font-size:11px;color:#7a8794;}
#card .plan{background:#1d2430;color:#fff;border-radius:12px;padding:9px 12px;font-weight:800;line-height:1.6;}
#card .plan b{color:#ff9a9a;}
#card .go{display:block;margin:10px auto 0;border:0;border-radius:12px;padding:10px 22px;font-family:inherit;font-size:15px;font-weight:900;background:#e2603c;color:#fff;cursor:pointer;box-shadow:0 3px 0 #a3361b;}
@media (prefers-reduced-motion: reduce){ .mp.tada,.mp.shake{animation:none;} #ngFlash.on{animation:ngf .54s steps(1);} }

/* 部屋を移るときの暗転（2026-10-20） */
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:5;}

/* キーボード入力の欄（2026-10-20） */
.mp .kbrow{display:flex;align-items:center;justify-content:center;gap:6px;margin:4px 0 6px;font-size:12px;font-weight:800;color:#5b6675;}
.mp .kb{width:200px;height:30px;border:1.5px solid #c9d3df;border-radius:8px;padding:0 10px;font-size:15px;font-family:inherit;}
.mp .kb:focus{outline:none;border-color:#6b3fc4;box-shadow:0 0 0 3px rgba(107,63,196,.18);}
#fxConfetti{position:fixed;inset:0;pointer-events:none;z-index:35;}

/* スタート画面のタイトルと難易度（2026-10-20） */
#card .ttl{font-size:clamp(30px,4vw,40px);font-weight:900;letter-spacing:.12em;color:#1d2430;text-align:center;margin:2px 0 0;}
#card .ttl+.big{text-align:center;font-size:18px;color:#a3501b;}
#card .lvh{text-align:center;font-size:12.5px;font-weight:900;color:#5b6675;margin:10px 0 6px;}
#card .lv{display:flex;gap:8px;justify-content:center;}
#card .lvb{flex:1;max-width:170px;border:2px solid #e2603c;background:#fff4ef;border-radius:14px;padding:9px 6px;font-family:inherit;cursor:pointer;color:#a3361b;box-shadow:0 3px 0 #e2b3a3;}
#card .lvb b{display:block;font-size:17px;font-weight:900;}
#card .lvb small{display:block;font-size:11px;font-weight:800;color:#7a5a4a;margin-top:2px;}
#card #bStart{background:#e2603c;color:#fff;box-shadow:0 3px 0 #a3361b;}
#card #bStart small{color:#ffe3d8;}
#card #bStart:hover{background:#d4532f;}
#card .lvb.off{border-color:#d3dbe5;background:#f4f6f9;color:#a0a8b4;box-shadow:none;cursor:not-allowed;}
#card .lvb.off small{color:#a0a8b4;}

/* むずかしい のボタン（2026-10-20）：押せるが ふつう より目立たせない */
#card #lv_hard{background:#2b2f3a;border-color:#2b2f3a;color:#fff;box-shadow:0 3px 0 #11141a;}
#card #lv_hard small{color:#c4cfdc;}
#card #lv_hard:hover{background:#3a4050;}

/* ホームへ戻るボタン（2026-10-21）：右上のいちばん右 */
.tbtn.home{background:#1d2430;border-color:#1d2430;color:#fff;}
.tbtn.home:hover{background:#2f3a4c;}

/* 段階ヒント（2026-10-21） */
#msgTx .hl{margin:3px 0;}
#msgTx .hn{display:inline-block;background:#ffd84d;color:#1d2430;border-radius:999px;padding:0 9px;margin-right:8px;font-size:12px;font-weight:900;}
#msgTx .hl.lock{color:#8b97a8;}
#msgTx .hl.lock .hn{background:#3a4350;color:#c4cfdc;}

/* 操作のしかた（2026-10-21。10-14 外心・内心 の作りにそろえた） */
#howto{position:fixed;inset:0;z-index:45;display:flex;align-items:center;justify-content:center;background:rgba(10,14,22,.62);padding:12px;}
#howto .hw{background:#fff;border-radius:18px;width:min(560px,100%);max-height:calc(100vh - 24px);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.35);}
#howto .hh{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;}
#howto .badge{background:#eef2ff;color:#3730a3;font-weight:900;font-size:14px;border-radius:999px;padding:4px 12px;}
#howto .hb{border:1.5px solid #c7d2fe;background:#fff;border-radius:10px;padding:5px 10px;font-family:inherit;font-weight:800;font-size:12.5px;cursor:pointer;color:#3730a3;}
#howto svg{display:block;width:100%;height:auto;max-height:52vh;background:linear-gradient(#f8faff,#eef2f7);flex:0 1 auto;min-height:0;}
#howto .hc{display:flex;align-items:center;gap:8px;padding:0 14px;min-height:46px;font-size:15px;font-weight:800;color:#3730a3;background:#eef2ff;border-top:1px solid #e0e7ff;}
#howto .hc.ok{color:#15803d;background:#ecfdf3;}
#howto .n{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:900;background:#4f46e5;color:#fff;}
#howto .hc.ok .n{background:#16a34a;}
#howto .hs{list-style:none;margin:0;padding:8px 14px 0;display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;font-size:12.5px;font-weight:700;color:#7a8794;}
#howto .hs li{display:flex;align-items:center;gap:6px;}
#howto .hs li .n{width:18px;height:18px;font-size:11px;background:#cbd5e1;}
#howto .hs li.on{color:#3730a3;} #howto .hs li.on .n{background:#4f46e5;}
#howto .hs li.done{color:#15803d;} #howto .hs li.done .n{background:#16a34a;}
#howto .hf{display:flex;justify-content:flex-end;padding:10px 14px 14px;}
#howto .hgo{border:0;border-radius:999px;padding:10px 22px;font-family:inherit;font-size:14px;font-weight:900;background:#e2e8f0;color:#334155;cursor:pointer;}
#howto .hgo.ready{background:#e2603c;color:#fff;box-shadow:0 3px 0 #a3361b;font-size:16px;padding:11px 30px;}

/* 操作のしかた：右に 小さく（2026-10-21）。上の #howto の指定を 上書き */
#howto.side{inset:auto;right:12px;top:50%;transform:translateY(-50%);background:none;padding:0;display:block;z-index:7;pointer-events:none;width:clamp(210px,21vw,290px);}
#howto.side .hw{width:100%;border-radius:14px;box-shadow:0 10px 26px rgba(0,0,0,.35);pointer-events:auto;}
#howto.side .hh{padding:6px 8px;}
#howto.side .badge{font-size:12px;padding:3px 10px;}
#howto.side .hb{padding:2px 8px;font-size:12px;}
#howto.side svg{max-height:none;}
#howto.side .hc{min-height:38px;font-size:12.5px;padding:4px 10px;line-height:1.35;}
#howto.side .n{width:19px;height:19px;font-size:11px;}

/* クリア画面のボタン（2026-10-21） */
#card .clbt{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px;}
#card .clbt .go{margin:0;}
#card .go.hard{background:#2b2f3a;box-shadow:0 3px 0 #11141a;font-size:16px;padding:11px 22px;}
#card .go.hard:hover{background:#3a4050;}
#card .go.sub{background:#e2e8f0;color:#334155;box-shadow:0 3px 0 #b8c2cf;}
/* 文字を 大きく（2026-10-22 ユーザー指定：10-21 の①と 同じ大きさに） */
body.esc #labels .lb.bub{font-size:16px;padding:7px 13px;line-height:1.5;white-space:normal;width:max-content;max-width:min(280px,40vw);word-break:keep-all;overflow-wrap:anywhere;}
#msgTx{font-size:clamp(17px,1.6vw,20px);line-height:1.65;}
#msgTx .hn{font-size:14px;}
#inv{padding:8px 12px;gap:10px;}
#inv .ih{font-size:clamp(16px,1.4vw,18px);}
.it{font-size:clamp(16px,1.4vw,18px);padding:7px 13px;gap:7px;border-radius:12px;}
.it .ic{font-size:20px;}
#invList:empty::after{font-size:16px;}
.lb.pk{font-size:14px;padding:4px 10px;}
.lb.pk .h{font-size:12px;}
.lb.tag.key{font-size:14px;padding:3px 11px;}

</style>

<script>/* =========================================================================
   scenery.js — ①②で共有する風景の部品（地面・木・茂み・岩・遠景の丘・雲・電柱）。

   カメラを360度回せるようにしたので、まわりが何もないと世界が薄く見える。
   ただし**学習の邪魔をしない**ことが第一なので、次の約束を守る。
     ・舞台（局・タワー・海）の外側にしか置かない（inner 半径より内側には出さない）
     ・背は低く（木は約2m）、カメラと舞台の間に来ても手前下に写るだけにする
     ・遠景の丘と雲はずっと遠くに置き、フォグで空になじませる
   GL リソースは InstancedMesh でまとめる（木1種類＝描画1回）。低スペックの生徒機でも
   風景ぶんの描画コールは10回ほどしか増えない。
   配置は固定の擬似乱数（seed）なので、全員が同じ風景を見る。
   ========================================================================= */
var SCENERY=(function(){
"use strict";
function lam(c){ return new THREE.MeshLambertMaterial({color:c}); }
function rng(seed){ var s=(seed>>>0)||1; return function(){ s=(s*1664525+1013904223)>>>0; return s/4294967296; }; }

/* ---------- 共有ジオメトリ ---------- */
var G_TRUNK=new THREE.CylinderGeometry(0.10,0.15,1.0,6);
var G_LEAF =new THREE.ConeGeometry(0.72,1.5,7);
var G_LEAF2=new THREE.ConeGeometry(0.52,1.1,7);
var G_BUSH =new THREE.SphereGeometry(0.5,8,6);
var G_ROCK =new THREE.DodecahedronGeometry(0.34,0);
var G_HILL =new THREE.ConeGeometry(1,1,12);
var G_CLOUD=new THREE.SphereGeometry(1,8,6);
var G_POLE =new THREE.CylinderGeometry(0.07,0.09,1,7);
var G_ARM  =new THREE.BoxGeometry(0.62,0.07,0.07);
var G_FLOWER=new THREE.SphereGeometry(1,6,4);

/* ---------- 地面のテクスチャ（1枚だけ作る） ---------- */
var GTEX={};
function groundTexture(key,base,spot){
  if(GTEX[key]) return GTEX[key];
  var c=document.createElement("canvas"); c.width=c.height=256; var g=c.getContext("2d");
  g.fillStyle=base; g.fillRect(0,0,256,256);
  var r=rng(1234);
  /* 大きな色むら（濃い／明るい）→ 細かい草の線。タイルの継ぎ目が出ないよう端は折り返して描く */
  function blob(x,y,rad,fill){ for(var dx=-256;dx<=256;dx+=256) for(var dy=-256;dy<=256;dy+=256){ g.fillStyle=fill; g.beginPath(); g.arc(x+dx,y+dy,rad,0,Math.PI*2); g.fill(); } }
  for(var i=0;i<120;i++) blob(r()*256,r()*256,8+r()*30,"rgba("+spot+","+(0.05+r()*0.10).toFixed(3)+")");
  for(var j=0;j<60;j++) blob(r()*256,r()*256,6+r()*20,"rgba(255,255,230,"+(0.05+r()*0.08).toFixed(3)+")");
  g.lineCap="round";
  for(var k=0;k<900;k++){
    var bx=r()*256, by=r()*256, bl=2+r()*4;
    g.strokeStyle=(r()<0.5)?"rgba("+spot+",0.28)":"rgba(255,255,235,0.22)"; g.lineWidth=1;
    g.beginPath(); g.moveTo(bx,by); g.lineTo(bx+(r()-0.5)*2,by-bl); g.stroke();
  }
  var t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(7,6);
  GTEX[key]=t; return t;
}
/* 草の地面。色むらのあるテクスチャを貼るだけ（べた塗りだと回したとき平べったく見える） */
function ground(scene,opt){
  opt=opt||{};
  var tex=groundTexture(opt.key||"grass",opt.base||"#a9cf8c",opt.spot||"70,125,60");
  var m=new THREE.Mesh(new THREE.PlaneGeometry(opt.size||90,opt.size2||70),
        new THREE.MeshLambertMaterial({map:tex}));
  m.rotation.x=-Math.PI/2; m.position.y=(opt.y===undefined?-0.02:opt.y); scene.add(m);
  return m;
}

/* ---------- InstancedMesh のヘルパ ---------- */
var _o=new THREE.Object3D();
function put(scene,geo,mat,list){
  if(!list.length) return null;
  var im=new THREE.InstancedMesh(geo,mat,list.length);
  for(var i=0;i<list.length;i++){
    var o=list[i];
    _o.position.set(o.x,o.y,o.z); _o.rotation.set(0,o.ry||0,0);
    _o.scale.set(o.s,(o.sy||o.s),o.s); _o.updateMatrix();
    im.setMatrixAt(i,_o.matrix);
  }
  im.instanceMatrix.needsUpdate=true; scene.add(im); return im;
}
/* 影を落とす InstancedMesh（木・茂み・岩・電柱）。LOOK.finish が userData.cast を見る */
function putC(scene,geo,mat,list){ var im=put(scene,geo,mat,list); if(im){ im.userData.cast=true; } return im;
}

/* ---------- 木・茂み・岩を、舞台の外にリング状にまく ---------- */
/* opt: {seed, inner, outer, trees, bushes, rocks, avoid:[{x,z,r}], zScale} */
function plants(scene,opt){
  opt=opt||{};
  var r=rng(opt.seed||20260918), inner=opt.inner||10, outer=opt.outer||19, zs=(opt.zScale===undefined?0.82:opt.zScale);
  var avoid=opt.avoid||[];
  function spot(){
    for(var k=0;k<40;k++){
      var a=r()*Math.PI*2, d=inner+r()*(outer-inner);
      var x=Math.cos(a)*d, z=Math.sin(a)*d*zs, ok=true;
      for(var i=0;i<avoid.length;i++){ var v=avoid[i]; if(Math.hypot(x-v.x,z-v.z)<v.r){ ok=false; break; } }
      if(ok) return {x:x,z:z};
    }
    return null;
  }
  var trunks=[], leaves=[], leaves2=[], bushes=[], rocks=[];
  var nT=(opt.trees===undefined?26:opt.trees);
  for(var i=0;i<nT;i++){
    var p=spot(); if(!p) continue;
    var s=0.8+r()*0.55, ry=r()*Math.PI*2, tall=(r()<0.45);
    trunks.push({x:p.x,y:0.5*s,z:p.z,s:s,ry:ry});
    (tall?leaves2:leaves).push({x:p.x,y:(tall?1.45:1.4)*s,z:p.z,s:s,ry:ry});
    if(tall) leaves2.push({x:p.x,y:2.05*s,z:p.z,s:s*0.75,ry:ry});
  }
  for(var j=0;j<(opt.bushes===undefined?16:opt.bushes);j++){
    var q=spot(); if(!q) continue;
    var bs=0.55+r()*0.6; bushes.push({x:q.x,y:0.3*bs,z:q.z,s:bs,sy:bs*0.72,ry:r()*3});
  }
  for(var k2=0;k2<(opt.rocks===undefined?9:opt.rocks);k2++){
    var w=spot(); if(!w) continue;
    var rs=0.5+r()*0.7; rocks.push({x:w.x,y:0.16*rs,z:w.z,s:rs,sy:rs*0.7,ry:r()*3});
  }
  putC(scene,G_TRUNK,lam(0x8a6a4a),trunks);
  putC(scene,G_LEAF, lam(0x5aa257),leaves);
  putC(scene,G_LEAF2,lam(0x3f8a4c),leaves2);
  putC(scene,G_BUSH, lam(0x6fae62),bushes);
  putC(scene,G_ROCK, lam(0xa3aab3),rocks);
  /* 花畑（小さな球を3色）。低いので舞台はふさがない */
  var fl=[[],[],[]];
  for(var f=0;f<(opt.flowers===undefined?14:opt.flowers);f++){
    var c0=spot(); if(!c0) continue;
    for(var q2=0;q2<9;q2++){ var fa=r()*6.28, fd=r()*0.7; fl[q2%3].push({x:c0.x+Math.cos(fa)*fd,y:0.06,z:c0.z+Math.sin(fa)*fd,s:0.05+r()*0.03}); }
  }
  put(scene,G_FLOWER,lam(0xffffff),fl[0]);
  put(scene,G_FLOWER,lam(0xffd84d),fl[1]);
  put(scene,G_FLOWER,lam(0xf29bb0),fl[2]);
}

/* ---------- 遠景の丘（地平線） ---------- */
function hills(scene,opt){
  opt=opt||{};
  var r=rng(opt.seed||777), n=opt.n||14, r0=opt.r0||30, r1=opt.r1||44;
  var a=[], b=[];
  for(var i=0;i<n;i++){
    var ang=(i/n)*Math.PI*2+r()*0.25, d=r0+r()*(r1-r0);
    var w=5+r()*7, h=2.4+r()*3.4;
    (i%2?b:a).push({x:Math.cos(ang)*d,y:-0.2,z:Math.sin(ang)*d*0.9,s:w,sy:h});
  }
  put(scene,G_HILL,lam(0x9cc796),a);
  put(scene,G_HILL,lam(0x86b683),b);
}

/* ---------- 雲 ---------- */
function clouds(scene,opt){
  opt=opt||{};
  var r=rng(opt.seed||555), n=opt.n||8, list=[];
  for(var i=0;i<n;i++){
    var ang=(i/n)*Math.PI*2+r()*0.6, d=(opt.r0||15)+r()*((opt.r1||30)-(opt.r0||15));
    var cx=Math.cos(ang)*d, cz=Math.sin(ang)*d*0.85, cy=(opt.y0||8)+r()*((opt.y1||14)-(opt.y0||8));
    var s=1.1+r()*0.9;

  EL=document.createElement('div'); EL.id='howto'; EL.className='side';
  EL.innerHTML='<div class="hw"><div class="hh"><span class="badge">操作のしかた</span><button class="hb" id="hwX" title="とじる">✕</button></div>'+

    '<div class="hc" id="hwCap"></div></div>';

  if(now-endT>=20000){ finish(); return; }                         /* 開いてから 20秒（実時間）で 消える（2026-10-21 ユーザー指定） */

  var w=canvas.clientWidth, h=canvas.clientHeight, placed=[];
  LABELS.forEach(function(L){
    if(!L.on){ if(L.el.style.display!=="none") L.el.style.display="none"; return; }
    _v.copy(L.pos).project(camera);
    if(_v.z>1||Math.abs(_v.x)>1.2||Math.abs(_v.y)>1.2){ if(L.el.style.display!=="none") L.el.style.display="none"; return; }
    if(L.el.style.display==="none"){ L.el.style.display=""; L.dirty=true; }
    if(L.dirty){ L.w=L.el.offsetWidth; L.h=L.el.offsetHeight; L.dirty=false; }
    L.sx=(_v.x+1)/2*w; L.sy=(1-_v.y)/2*h; L.z=_v.z; placed.push(L);
  });
  placed.sort(function(a,b){ return (a.nudge===b.nudge)?a.z-b.z:(a.nudge?1:-1); });

    var x=L.sx, y=L.sy;
    if(L.nudge){ for(var k=0;k<8;k++){ var hit=null; for(var i=0;i<boxes.length;i++){ var B=boxes[i]; if(Math.abs(x-B.x)<(L.w+B.w)/2+3&&y>B.y-B.h-2&&y-L.h<B.y+2){ hit=B; break; } } if(!hit) break; y=hit.y-hit.h-3; } }

function node(id,o){

function setNodeLabel(id,html,extra){ setL(NODES[id].label,html,extra); }

function cable(a,b,opt){
  opt=opt||{};
  var A=NODES[a].port, B=NODES[b].port;
  var mid=A.clone().lerp(B,0.5); mid.y=Math.max(A.y,B.y)*0.5+(opt.lift===undefined?0.25:opt.lift);
  var pts=[A.clone(),A.clone().lerp(mid,0.5),mid,mid.clone().lerp(B,0.5),B.clone()];
  if(opt.via) pts=[A.clone()].concat(opt.via.map(function(p){ return new V3().fromArray(p); })).concat([B.clone()]);
  var curve=new T.CatmullRomCurve3(pts,false,"centripetal");
  var len0=curve.getLength(), tex=new T.CanvasTexture(flowCanvas()); tex.wrapS=tex.wrapT=T.RepeatWrapping; tex.repeat.set(Math.max(1,Math.round(len0*1.2)),1); LOOK.scroll(tex,-(opt.flow||0.5),0);
  var mat=new T.MeshBasicMaterial({color:opt.color||0x8fb8e8,map:tex});
  var tube=new T.Mesh(new T.TubeGeometry(curve,48,opt.r||0.045,6,false),mat); tube.userData.noCast=true; scene.add(tube);
  var C={a:a,b:b,curve:curve,mesh:tube,mat:mat,base:new T.Color(opt.color||0x8fb8e8),flash:0,len:curve.getLength()};
  CABLES.push(C); return C;
}
/* ケーブルの中を流れる光（暗めの地に明るいすじ） */
var FLOWC=null;
function flowCanvas(){ if(FLOWC) return FLOWC; var c=document.createElement("canvas"); c.width=64; c.height=4; var g=c.getContext("2d"); var gr=g.createLinearGradient(0,0,64,0);
  gr.addColorStop(0,"#c8c8c8"); gr.addColorStop(0.55,"#c8c8c8"); gr.addColorStop(0.78,"#ffffff"); gr.addColorStop(0.86,"#ffffff"); gr.addColorStop(1,"#c8c8c8"); g.fillStyle=gr; g.fillRect(0,0,64,4); FLOWC=c; return c; }

/* ids をつないだ経路（点列と累積長） */
function route(ids){
  var pts=[], hops=[];
  for(var i=0;i<ids.length-1;i++){
    var f=findCable(ids[i],ids[i+1]); if(!f) throw new Error("no cable "+ids[i]+"-"+ids[i+1]);
    var n=36, sp=f.C.curve.getSpacedPoints(n); if(f.rev) sp.reverse();
    hops.push({C:f.C,from:pts.length});
    for(var k=(i===0?0:1);k<sp.length;k++) pts.push(sp[k]);
  }
  var acc=[0]; for(var j=1;j<pts.length;j++) acc.push(acc[j-1]+pts[j].distanceTo(pts[j-1]));

  if(d<=0) return out.copy(R.pts[0]); if(d>=R.len) return out.copy(R.pts[R.pts.length-1]);
  var lo=0, hi=R.acc.length-1; while(hi-lo>1){ var m=(lo+hi)>>1; if(R.acc[m]<d) lo=m; else hi=m; }
  var u=(d-R.acc[lo])/Math.max(1e-6,R.acc[hi]-R.acc[lo]); return out.copy(R.pts[lo]).lerp(R.pts[hi],u);
}

/* ---------- 蛍光の縁どり（注目させる） ----------
   2026-10-15 ユーザー指定：「周りを暗くしてスポットライトを当てるのではなく、暗くせずに、
   注目するものの縁を蛍光で囲む」。場面の明るさは変えず、注目するものの輪郭だけを光らせる。
   しくみ（画面の上で輪郭を取る）：
     1) 注目するものだけを、白黒の「型」として半分の解像度の板（mask）に描く
        （1本目は赤、2本目は緑のチャンネル。手前に物があっても型はまるごと描く＝隠れていても縁が見える）
     2) 全画面の板で、型のまわり（外側）に蛍光の線と にじみ を足す。ゆっくり明滅
   2本まで。1本目＝蛍光イエロー（動いているパケット・いま話している人など）、2本目＝蛍光シアン（行き先）。
   名札も同じ色で光らせる（.lb.nm.spot / .spot2）。出るときは 0.25s で ease-out（motion-ref：ui-feedback の入り）。 */

    if(CHAR[t]){ var c=CHAR[t]; return [c.holder].concat(c.desk?[c.desk]:[]).concat(c.room?[c.room]:[]); }   /* キャラ＋机＋部屋全体 */
    var N=NODES[t]; return (N&&N.obj)?[N.obj]:[];

var INS={l:0,r:0,tl:0,tr:0,chk:0};
function measureInsets(){
  var W=host.clientWidth, H=host.clientHeight;
  function side(e,left){
    /* position:fixed の要素は offsetParent が常に null なので、display で見る */
    if(!e||e.classList.contains("shut")||getComputedStyle(e).display==="none") return 0;
    var r=e.getBoundingClientRect(); if(r.width<40||r.height<90) return 0;
    if(r.bottom<H*0.3) return 0;                 /* 上の方だけなら絵にかからない */
    return left?r.right+14:W-r.left+14;
  }
  INS.tl=side(document.querySelector(".pc.l"),true); INS.tr=side(document.querySelector(".pc.r"),false);   /* 悪者の画面（.pc.c）は 猫の右上に ついていくので よけない（2026-10-21） */
}
function updateInsets(dt){
  INS.chk-=dt; if(INS.chk<=0){ INS.chk=0.15; measureInsets(); }
  var k=dt>0?1-Math.exp(-dt/0.35):1; INS.l+=(INS.tl-INS.l)*k; INS.r+=(INS.tr-INS.r)*k;
  applyInsets();
}
function applyInsets(){
  var W=host.clientWidth, H=host.clientHeight;
  if(INS.l<0.5&&INS.r<0.5){ if(camera.view&&camera.view.enabled) camera.clearViewOffset(); return; }
  /* あいている幅に合わせて少し引く（ずらすのが主。引きすぎると模型が小さくなる） */
  var both=INS.l>0.5&&INS.r>0.5, f=Math.max(0.8,1-(INS.l+INS.r)/W*(both?0.3:0.4));
  /* setViewOffset は「ふだんの画角＝fullWidth×fullHeight の絵」から W×H の窓を切り出す。
     full を W・H より小さくすると窓のほうが広くなり、引いた絵になる */
  var fw=W*f, fh=H*f, cx=W/2+(INS.l-INS.r)/2, cy=H/2+H*(1-f)*0.35;   /* 引いたぶん少し下げて地面を残す */
  camera.setViewOffset(fw,fh,fw/2-cx,fh/2-cy,W,H);
}

function frame(now){
  requestAnimationFrame(frame);
  var dt=Math.min(0.05,(now-last)/1000); last=now;
  updateInsets(dt);
  step(dt);
  renderer.render(scene,camera);
  renderOutline();
  projectLabels();
  if(!checked){ frames++; slow+=dt; if(frames===90){ checked=true; if(slow/frames>0.025&&LK.shadows) LK.setShadows(false); } }
}
function step(dt){
  var d=PAUSED?0:dt;           /* 一時停止中は場面の動き・キャラ・吹き出しを止める（カメラ・縁どりは動かす） */
  updateTweens(d*SPEED);
  updateCamera(dt);
  updateCables(d);
  updatePackets();
  updateChars(d);
  updateBubbles(d);
  updatePulse(d);
  updateSpots(dt);
  FX.update(d); LOOK.update(d);
  if(ST.onFrame) ST.onFrame(d);
  if(toastT>0){ toastT-=d; if(toastT<=0) hideToast(); }
}

/* ---------- 一時停止（2026-10-20 ユーザー指定：②③に一時停止ボタン） ----------
   上の「⏸ 一時停止」か スペース・P キーで止める／再開。前へ・次へ・番号で場面を変えると自動で再開する */
var PAUSED=false;
function setPause(p){
  PAUSED=!!p;
  var b=$("bPause"); if(b){ b.innerHTML=PAUSED?"▶ 再開":"⏸ 一時停止"; b.classList.toggle("on",PAUSED); b.title=PAUSED?"動きを再開する（スペースキー）":"動きを止める（スペースキー）"; }
  document.body.classList.toggle("paused",PAUSED);
}
function togglePause(){ SFX.click(); setPause(!PAUSED); }
function bindPause(){ var b=$("bPause"); if(b) b.addEventListener("click",togglePause); setPause(false); }

/* ---------- 動き（ctx に属する tween） ---------- */
function updateTweens(dt){
  for(var i=TW.length-1;i>=0;i--){
    var w=TW[i];
    if(w.ctx.dead){ TW.splice(i,1); continue; }
    w.t+=dt; var u=(w.ctx.skip||w.dur<=0)?1:Math.min(1,w.t/w.dur);
    if(w.fn) w.fn(u);
    if(u>=1){ TW.splice(i,1); w.res(); }
  }
}
var CANCEL={cancel:true};
function Ctx(free){
  var A={dead:false,skip:false,done:false,free:!!free};
  A.check=function(){ if(A.dead) throw CANCEL; };
  /* sec 秒かけて fn(u) を 0→1。skip 中は即座に fn(1) */
  A.tween=function(sec,fn){
    if(A.dead) return new Promise(function(){});
    if(A.skip||REDUCE&&sec<3){ if(fn) fn(1); return Promise.resolve(); }
    return new Promise(function(res){ TW.push({ctx:A,t:0,dur:sec,fn:fn,res:function(){ if(!A.dead) res(); }}); });
  };
  A.wait=function(sec){ return A.tween(sec,null); };
  /* パケットを ids の経路で運ぶ。opt:{dur, speed, lift, from(0..1), to, onHop} */
  A.send=function(pk,ids,opt){
    A.check(); opt=opt||{};
    if(ids.length<2) return Promise.resolve();
    var R=route(ids), dur=opt.dur||Math.max(1.2,Math.min(3.2,R.len/(opt.speed||5.2)));
    var lift=(opt.lift===undefined?0.28:opt.lift), from=opt.from||0, to=(opt.to===undefined?1:opt.to);
    pk.g.visible=true; var p=new V3(), hopSeen=-1, lastE=null;
    if(!A.skip) SFX.send();
    var dest=ids[ids.length-1];
    if(opt.cam!==false&&opt.spot!==false) spot(pk,to>=1?dest:null);   /* 動いているパケットと行き先を照らす（カメラは動かさない） */
    return A.tween(dur,function(u){
      var e=ease(u), d=R.len*(from+(to-from)*e);
      routeAt(R,d,p); pk.g.position.copy(p); pk.g.position.y+=lift;
      pk.g.rotation.y=Math.sin(u*Math.PI*2)*0.25;
      if(!A.skip&&u<1){ if(!lastE){ lastE=pk.g.position.clone(); } else if(lastE.distanceTo(pk.g.position)>0.16){ lastE.copy(pk.g.position); FX.burst(lastE,pk.color||0x6fb1ff,1,{speed:0.12,up:0.05,grav:0,life:0.55,size:0.15,spread:0.05,drag:3}); } }
      for(var h=R.hops.length-1;h>=0;h--){ if(R.acc[R.hops[h].from]<=d){ if(h!==hopSeen){ hopSeen=h; flashCable(R.hops[h].C); if(opt.onHop) opt.onHop(h); } break; } }
    }).then(function(){ if(to>=1&&opt.cam!==false&&opt.spot!==false&&!A.dead) spot(dest); if(!A.skip&&to>=1){ SFX.arrive(); var e=R.pts[R.pts.length-1]; FX.ring(new V3(e.x,0.03,e.z),pk.color||0x6fb1ff,1.3,0.7); } });
  };
  /* 置く（経路の位置 u に） */
  A.place=function(pk,ids,u,lift){ var R=route(ids), p=new V3(); routeAt(R,R.len*u,p); pk.g.position.copy(p); pk.g.position.y+=(lift===undefined?0.28:lift); pk.g.visible=true; };
  /* 文字を1つずつ打つ（tx-caret-typewriter：1文字 70ms） */
  A.type=function(text,set,who){
    var n=text.length, last=-1;
    if(who){ charMode(who,"type"); spot(who); }
    return A.tween(Math.max(0.3,n*0.07),function(u){ var k=Math.round(n*u); if(k!==last){ last=k; set(text.slice(0,k),u<1); if(!A.skip&&u<1) SFX.key(); } }).then(function(){ if(who) charMode(who,"idle"); });
  };
  /* 1回だけ押させる（クイズなど）。skip 中は null で即答 */
  A.ask=function(setup){ if(A.dead) return new Promise(function(){}); if(A.skip) return Promise.resolve(null); return new Promise(function(res){ setup(function(v){ if(!A.dead) res(v); }); }); };
  return A;
}

/* ---------- 場面の進行 ---------- */
var PL={topics:[],ti:-1,si:0,ctx:null,seen:{}};
function topics(list){ PL.topics=list; renderChips(); }
function kill(){ if(PL.ctx){ PL.ctx.dead=true; } if(PL.pre){ PL.pre.dead=true; PL.pre=null; } TW.length=0; if($("cueUp")) cueOff(); dimScene(false); var ln=document.querySelector("#capTx .line"); if(ln) ln.style.clipPath=""; }
function goTopic(ti,si){
  kill(); PL.intro=false; setPause(false);
  PL.ti=ti; PL.si=si||0;
  var tp=PL.topics[ti];
  renderChips();
  hideCard(); hush(); $("toast").className=""; toastT=0; spot(null);
  if(ST.reset) ST.reset(tp);
  if(tp.free){ runFree(tp); return; }
  var A=Ctx(); A.skip=true; PL.ctx=A;
  var chain=Promise.resolve();
  for(var k=0;k<PL.si;k++){ (function(k){ chain=chain.then(function(){ return tp.steps[k].run(A); }); })(k); }
  chain.then(function(){ if(A.dead) return; hush(); A.skip=false; return playStep(A); }).catch(onErr);
}
function playStep(A){
  var tp=PL.topics[PL.ti], s=tp.steps[PL.si];
  showCaption(tp,PL.si,false);
  CAM.user=false; renderCamUI();
  spot(null); hush(); hideToastNow(); pcStep(false);
  /* 場面の始めは いつも 全体へ（自動カメラ OFF でも。2026-10-21：クリックで寄ったまま 次の場面でも 特定の物を 映しつづけることがあった） */
  if(CAM.auto) cam(s.cam||"wide"); else { CAM.user=false; CAM.label=""; orbit.th=0; orbit.ph=0; zoom=1; setShot("wide"); renderCamUI(); }
  return preroll(A).then(function(){ if(A.dead) return new Promise(function(){}); return s.run(A); }).then(function(){
    if(A.dead) return; A.done=true; showCaption(tp,PL.si,true);
    if(s.end) cam(s.end);
    /* 自動カメラ ON：動きが終わって 1.6秒たったら 全体にもどす（最後の物に 寄ったままに しない） */
    if(CAM.auto&&!s.end){ var me=A; setTimeout(function(){ if(PL.ctx===me&&me.done&&!me.dead&&CAM.auto&&!CAM.user) setShot("wide"); },1600); }
    PL.seen[tp.id+":"+PL.si]=true; if(PL.si===tp.steps.length-1){ PL.seen[tp.id]=true; renderChips(); }
  });
}
/* 場面の入り（2026-10-20 ユーザー指定）
   1) 説明文を左から右へ出す（motion-ref typewriter：linear。1文字 45ms、0.8〜2.0 秒）
   2) ひと呼吸 0.35 秒
   3) 字幕の枠の上のふちから ▲ が5本 わき上がって消える（fade-slide 600ms easeOutCubic を 80ms ずつずらす。全体 0.92 秒）
   → 動きが始まる。動きの中で 話す・反応する物には 蛍光の縁どり（say・react で自動）
   入りの間に Enter を押すと、文を最後まで出して すぐ動きへ（PL.pre.skip）。動きの途中の Enter・「次へ ▶」は 次の場面へ。
   入りは 場面とは別の ctx（PL.pre）で動かすので、飛ばしても 場面の動きは飛ばない。一時停止・速さは同じように効く */
var CUE_X=[0.14,0.32,0.5,0.68,0.86];
function cueArrows(){ var c=$("cueUp"); if(!c) return []; if(!c.children.length) CUE_X.forEach(function(x){ var e=document.createElement("i"); e.textContent="▲"; e.style.left=(x*100)+"%"; c.appendChild(e); }); return [].slice.call(c.children); }
function cueOff(){ cueArrows().forEach(function(e){ e.style.opacity=0; e.style.translate=""; }); }
/* 2026-10-21 ユーザー指定：①文が出きったあとを テンポよく（ひと呼吸 0.35→0.12秒）、▲5本は いっきに出して すぐ動きへ
   （その後 ユーザー指定で ▲を出してから 1秒後に 動き出す形に）。
   ②文が流れている間は 3D を暗く（#sceneDim）、動き出したら明るくして 注目させる（0.25秒の フェード） */
function dimScene(on){ var d=$("sceneDim"); if(d) d.classList.toggle("on",!!on); }
function preroll(A){
  var ln=document.querySelector("#capTx .line");
  if(A.skip||!ln){ if(ln) ln.style.clipPath=""; dimScene(false); return Promise.resolve(); }
  var P=Ctx(); PL.pre=P;
  var n=(ln.textContent||"").length, dur=Math.max(0.8,Math.min(2.0,n*0.045));
  ln.style.clipPath="inset(-6px 100% -6px 0)"; dimScene(true);
  return P.tween(dur,function(u){ ln.style.clipPath=u>=1?"":"inset(-6px "+(100-100*u).toFixed(2)+"% -6px 0)"; })
    .then(function(){ return P.wait(0.12); })
    .then(function(){
      ln.style.clipPath="";
      if(REDUCE||P.skip) return;
      /* 2026-10-21 ユーザー指定：▲5本を いっきに出して、その 1秒後に 動き出す。▲は 1秒かけて 上がって消える */
      var ar=cueArrows();
      return P.tween(1.0*SPEED,function(u){       /* 速さの設定に関係なく 実時間で 1秒 */
        var y=-44*(1-Math.pow(1-u,3)), o=u<0.12?u/0.12:(u<0.6?1:Math.max(0,1-(u-0.6)/0.4));
        ar.forEach(function(e){ e.style.translate="-50% "+y.toFixed(1)+"px"; e.style.opacity=o.toFixed(2); });
      });
    })
    .then(function(){
      if(PL.pre===P) PL.pre=null; ln.style.clipPath=""; cueOff(); dimScene(false);   /* ここで 明るくなって 動き出す */
      if(A.dead) return new Promise(function(){});
    });
}
/* 話す・反応するキャラに 蛍光の縁どり（2026-10-20 ユーザー指定：注目するもの・反応がある物には蛍光）。
   すでに2本とも使っていれば 足さない（場面で決めた注目を こわさない） */
function autoSpot(id){
  if(!PL.ctx||PL.ctx.free||PL.ctx.skip||!CHAR[id]) return;
  var a=OUT.tgt[0], b=OUT.tgt[1]; if(a===id||b===id) return;
  if(!a) spot(id,b); else if(!b) spot(a,id);
}
function onErr(e){ if(e!==CANCEL) console.error(e); }
function next(){
  setPause(false);
  if(PL.intro){ SFX.click(); if(PL.introNext){ var f=PL.introNext; PL.introNext=null; f(); } else skip(); return; }
  var tp=PL.topics[PL.ti]; SFX.click();
  if(!tp.free&&PL.si<tp.steps.length-1){ PL.si++; var A=PL.ctx; if(A&&A.done&&!A.dead){ A.done=false; A.skip=false; playStep(A).catch(onErr); } else goTopic(PL.ti,PL.si); }
  else if(PL.ti<lastShown()) goTopic(PL.ti+1,0);
  else if(homeIndex()>=0) goTopic(homeIndex(),0);          /* 最後まで見たら「やってみる」へもどる */
}
/* 「次へ ▶」で進める先があるか（ボタンが出ていなくても。Enter は動いている途中でも次へ進む） */
function canNext(){ if(PL.intro) return true; var tp=PL.topics[PL.ti]; if(!tp) return false; var last=tp.free||PL.si===tp.steps.length-1; return !last||PL.ti<lastShown()||(!tp.free&&homeIndex()>=0); }
function homeIndex(){ for(var i=0;i<PL.topics.length;i++) if(PL.topics[i].id==="home") return i; return -1; }
/* 「次へ」で たどる さいごの話題。extra（②の「もしも」）は 番号ボタンからだけ 入る（2026-10-21 ユーザー指定：4 が終わったら いったん おわり） */
function lastShown(){ for(var i=PL.topics.length-1;i>=0;i--) if(!PL.topics[i].hidden&&!PL.topics[i].extra) return i; return 0; }
function prev(){ SFX.click(); if(PL.si>0) goTopic(PL.ti,PL.si-1); else if(PL.ti>0) goTopic(PL.ti-1,PL.topics[PL.ti-1].free?0:PL.topics[PL.ti-1].steps.length-1); }
function replay(){ SFX.click(); goTopic(PL.ti,PL.si); }
function skip(){ var A=PL.ctx; if(A&&!A.done&&!A.free){ A.skip=true; } }
function runFree(tp){
  var A=Ctx(true); PL.ctx=A; A.done=true;
  showCaption(tp,0,true); pcStep(true);
  CAM.user=false; cam("wide"); spot(null);
  if(tp.enter) Promise.resolve(tp.enter(A)).catch(onErr);
}
/* 自由にさわる：ボタンから動きを走らせる。前の動きが終わるまで次は受けない */
var busy=false;
function freeRun(fn){
  var A=PL.ctx; if(!A||!A.free||A.dead) return false;
  if(busy){ toast("いま動いているところ。終わるまで待ってね"); return false; }
  busy=true; document.body.classList.add("busy");
  Promise.resolve(fn(A)).catch(onErr).then(function(){ busy=false; document.body.classList.remove("busy"); if(ST.onFreeDone) ST.onFreeDone(); });
  return true;
}
function isFree(){ return !!(PL.ctx&&PL.ctx.free&&!PL.ctx.dead); }

/* ---------- オープニング（camera-flight：1区間 1.5s・着いたら 1s 見せる） ----------
   shots: [{shot, cap, say:[id,html], hold}]。クリック・Enter・「とばす」で全部とばせる */
function intro(shots,onDone){
  /* 1場面ずつ「次へ ▶」で進む（ユーザー指定：自動で文章を進めない）。動きの途中の Enter・クリックは動きだけ飛ばす */
  kill(); hideCard(); hush(); pcStep(false); pcArmed=false;
  var A=Ctx(); PL.ctx=A; PL.intro=true; PL.introNext=null;
  var cap=$("cap"); cap.classList.add("on");
  $("capTi").innerHTML='<span class="no">▶</span>オープニング';
  $("bPrev").disabled=true; $("bReplay").style.display="none";
  var nx=$("bNext"), n=shots.length, sk=$("bSkipIntro");
  function finish(){ PL.intro=false; PL.introNext=null; hush(); spot(null); if(sk) sk.classList.remove("on"); onDone(); }
  if(sk){ sk.classList.add("on"); sk.onclick=function(){ if(A.dead||!PL.intro) return; SFX.click(); kill(); finish(); }; }   /* オープニングをとばす（2026-10-15 ユーザー指定） */
  var chain=Promise.resolve();
  shots.forEach(function(it,k){ chain=chain.then(function(){
    if(A.dead) return new Promise(function(){});
    A.skip=false; A.done=false; hush(); cap.classList.add("playing");
    nx.style.visibility="hidden"; nx.classList.remove("show");
    var dots=$("capDots"); dots.innerHTML=""; for(var d=0;d<n;d++){ var e=document.createElement("i"); e.className=d===k?"on":(d<k?"was":""); dots.appendChild(e); }
    $("capTi").innerHTML='<span class="no">▶</span>オープニング<span class="k">'+(k+1)+' / '+n+'</span>';
    var tx=$("capTx"); tx.innerHTML='<div class="line">'+it.cap+'</div>'; fitCap(); tx.setAttribute("data-k",""); enter(tx,0,16); document.documentElement.style.setProperty("--caph",(cap.offsetHeight||70)+"px");
    if(it.shot) setShot(it.shot,{force:true,dur:1.5}); else setShot("wide");
    spot(it.spot?it.spot[0]:null,it.spot?it.spot[1]:null);
    return A.wait(it.shot?1.5:0.6).then(function(){ if(it.say){ say(it.say[0],it.say[1]); charMode(it.say[0],it.mood||"happy"); } if(it.fn) it.fn(); return A.wait(0.4); })
      .then(function(){
        if(A.dead) return new Promise(function(){});
        A.done=true; cap.classList.remove("playing");
        nx.innerHTML=(k<n-1)?"次へ ▶":"はじめる ▶"; nx.style.visibility="visible"; nx.classList.add("show"); enter(nx,0,10);
        return new Promise(function(res){ PL.introNext=res; });
      });
  }); });
  chain.then(function(){ if(A.dead) return; finish(); }).catch(onErr);
}

/* ---------- 字幕 ---------- */
function showCaption(tp,si,done){
  var cap=$("cap"), free=!!tp.free, n=free?0:tp.steps.length;
  var s=free?{cap:tp.cap}:tp.steps[si];
  $("capTi").innerHTML='<span class="no">'+(tp.no||"")+'</span>'+tp.title+(free?'':'<span class="k">'+(si+1)+' / '+n+'</span>');
  var tx=$("capTx"), html=(typeof s.cap==="function")?s.cap():s.cap;
  if(tx.getAttribute("data-k")!==tp.id+":"+si){ tx.setAttribute("data-k",tp.id+":"+si); tx.innerHTML='<div class="line">'+html+'</div>'; if(free&&tp.actions) actRow(tx,tp.actions); enter(tx,0,16); }
  fitCap();
  var dots=$("capDots"); dots.innerHTML=""; for(var i=0;i<n;i++){ var d=document.createElement("i"); if(i===si) d.className="on"; else if(i<si) d.className="was"; dots.appendChild(d); }
  $("bPrev").disabled=(PL.ti===0&&si===0);
  $("bReplay").style.display=free?"none":"";
  var nx=$("bNext"), last=free||si===n-1, more=PL.ti<lastShown(), home=!free&&homeIndex()>=0;
  nx.innerHTML=last?(more?(free?'説明 <b>'+(PL.topics[PL.ti+1].no||"")+'</b> を見る ▶':'つぎの話へ <b>'+(PL.topics[PL.ti+1].no||"")+'</b> ▶'):(home?'▶ やってみる にもどる':'おわり')):'次へ ▶';
  var nxOn=(done||$("bPause"))&&(!last||more||home);     /* ②③（一時停止ボタンがある方）は 動きの途中でも「次へ ▶」を出す（2026-10-20） */
  /* さいごの場面が 終わったら、「次へ」の所に「おわり」を出す（2026-10-21 ユーザー指定。押せない） */
  var fin=!!$("bPause")&&done&&last&&!more&&!home;
  nx.classList.toggle("fin",fin); nx.disabled=fin;
  if(fin){ nx.innerHTML="✓ おわり"; nxOn=true; }
  /* 場面の動きが 終わったら「次へ ▶」を 蛍光で 光らせて 押せる合図に（2026-10-21 ユーザー指定。②③） */
  nx.classList.toggle("glow",!!$("bPause")&&done&&!fin&&nxOn);
  nx.style.visibility=nxOn?"visible":"hidden";
  if(nxOn&&!nx.classList.contains("show")){ nx.classList.add("show"); enter(nx,0,10); }
  if(!nxOn) nx.classList.remove("show");
  cap.classList.toggle("playing",!done);
  cap.classList.add("on");
  document.documentElement.style.setProperty("--caph",(cap.offsetHeight||70)+"px");
  if(ST.onCaption) ST.onCaption(tp,si,done);
}

var WALLS=[];
function wallSide(x,z){
  if(Math.abs(z-BACK)<0.2) return {side:"back"};
  if(Math.abs(z-HD)<0.15) return {side:"front"};
  var wx=[-1.5*RW,-0.5*RW,0.5*RW,1.5*RW];
  for(var i=0;i<wx.length;i++) if(Math.abs(x-wx[i])<0.15) return {side:"side",x:wx[i]};
  return null;
}
/* カメラ側の壁を消す（ドールハウスの切り欠き）。外向きの向き・カメラの向き の内積が 0.25 をこえたら消す。手前の低い縁は消さない */
function cutaway(){
  if(G.room==="OUT"){ WALLS.forEach(function(w){ w.o.visible=true; }); return; }
  /* 基準は カメラが いま見ている点（部屋を移る途中も カメラと一緒に動く。2026-10-21：移る途中に 壁が消えていたのを直した） */
  var tg=ST.camTarget(), c=tg.x, cp=ST.camera.position, dx=cp.x-c, dz=cp.z-tg.z, L=Math.hypot(dx,dz)||1; dx/=L; dz/=L;
  WALLS.forEach(function(w){
    var ox=0, oz=0;
    if(w.side==="back") oz=-1; else if(w.side==="front") return; else ox=(w.x>c?1:-1);
    w.o.visible=(ox*dx+oz*dz)<0.25;
  });
}

/* ---------- 歩けるマス（0.2m） ---------- */
var CELL=0.2, X0=-1.5*RW-0.05, X1=1.5*RW+2.9, Z0=-HD-0.03, Z1=HD+0.13, NX=Math.round((X1-X0)/CELL), NZ=Math.round((Z1-Z0)/CELL), R=0.22;
/* 家具の当たり：[x, z, 半幅x, 半幅z, 奥の壁ぎわか] → [x0,x1,z0,z1]（置く位置と同じ fx・fz・bz で動かす） */
var FURN=[[1.2,1.0,0.35,0.35],[-6.4,-1.775,0.75,0.225,1],[-3.35,1.2,0.35,0.35],[-7.0,1.3,0.35,0.35],[-1.2,-0.4,0.78,0.38],[5.9,-1.55,0.48,0.4,1],[3.45,-1.62,0.33,0.22,1]].map(function(f){
  var x=fx(f[0]), z=f[4]?bz(f[1]):fz(f[1]); return [x-f[2],x+f[2],z-f[3],z+f[3]]; });
var WALLX=[-0.5*RW,0.5*RW,1.5*RW];
function doorOpen(i){ return i===0?G.f.doorA:i===1?G.f.doorB:G.f.exit; }
function free(x,z){
  if(x>1.5*RW+0.1){ return x<X1-0.3&&z>Z0+0.1&&z<Z1-0.3; }          /* 出口の外（原っぱ） */
  if(x<-1.5*RW+0.07+R||z<BACK+0.07+R||z>HD-0.07-R) return false;
  for(var i=0;i<3;i++){ if(Math.abs(x-WALLX[i])<0.07+R){ if(!(doorOpen(i)&&z>-1.3+R*0.8&&z<-0.3-R*0.8)) return false; } }
  for(var k=0;k<FURN.length;k++){ var f=FURN[k]; if(x>f[0]-R&&x<f[1]+R&&z>f[2]-R&&z<f[3]+R) return false; }
  return true;
}
function ci(x){ return Math.floor((x-X0)/CELL); } function cj(z){ return Math.floor((z-Z0)/CELL); }
function cx(i){ return X0+(i+0.5)*CELL; } function cz(j){ return Z0+(j+0.5)*CELL; }
function cellFree(i,j){ return i>=0&&j>=0&&i<NX&&j<NZ&&free(cx(i),cz(j)); }
function nearestCell(x,z){ var i0=ci(x), j0=cj(z); if(cellFree(i0,j0)) return [i0,j0]; for(var r=1;r<8;r++){ var best=null, bd=1e9; for(var dj=-r;dj<=r;dj++) for(var di=-r;di<=r;di++){ if(Math.max(Math.abs(di),Math.abs(dj))!==r) continue; var i=i0+di, j=j0+dj; if(!cellFree(i,j)) continue; var d=di*di+dj*dj; if(d<bd){ bd=d; best=[i,j]; } } if(best) return best; } return null; }
function astar(sx,sz,gx,gz){
  var s=nearestCell(sx,sz), g=nearestCell(gx,gz); if(!s||!g) return null;
  var K=function(i,j){ return j*NX+i; }, sk=K(s[0],s[1]), gk=K(g[0],g[1]);
  var open=[sk], gS={}, from={}, fS={}, closed={}; gS[sk]=0; fS[sk]=Math.hypot(g[0]-s[0],g[1]-s[1]);
  var guard=0;
  while(open.length&&guard++<20000){
    var bi=0; for(var q=1;q<open.length;q++) if(fS[open[q]]<fS[open[bi]]) bi=q;
    var cur=open.splice(bi,1)[0]; if(cur===gk) break; closed[cur]=true;
    var ci0=cur%NX, cj0=(cur/NX)|0;
    for(var dj=-1;dj<=1;dj++) for(var di=-1;di<=1;di++){
      if(!di&&!dj) continue; var ni=ci0+di, nj=cj0+dj; if(!cellFree(ni,nj)) continue;
      if(di&&dj&&(!cellFree(ci0+di,cj0)||!cellFree(ci0,cj0+dj))) continue;
      var nk=K(ni,nj); if(closed[nk]) continue; var t=gS[cur]+(di&&dj?1.414:1);
      if(gS[nk]===undefined||t<gS[nk]){ gS[nk]=t; from[nk]=cur; fS[nk]=t+Math.hypot(g[0]-ni,g[1]-nj); if(open.indexOf(nk)<0) open.push(nk); }
    }
  }
  if(gS[gk]===undefined) return null;
  var pts=[], k=gk; while(k!==undefined&&k!==sk){ pts.push(new V3(cx(k%NX),0,cz((k/NX)|0))); k=from[k]; } pts.reverse();
  /* まっすぐ行けるところは まとめる */
  var out=[], a=new V3(sx,0,sz);

}
function los(a,b){ var n=Math.ceil(a.distanceTo(b)/(CELL*0.5)); for(var s=1;s<n;s++){ var t=s/n; if(!free(a.x+(b.x-a.x)*t,a.z+(b.z-a.z)*t)) return false; } return true; }

/* ---------- 歩く ---------- */
var MV={path:null,then:null,keys:{},speed:2.4,walkT:0};
function pen(){ return ST.CHAR.pen.holder; }
function walkTo(x,z,then){
  if(!G.started||modalOn()) return;
  var p=pen().position, path=astar(p.x,p.z,x,z);
  if(!path){ msg('そこへは 行けない。<small>（扉が しまっている）</small>'); return; }
  if(!path.length){ if(then) then(); return; }
  MV.path=path; MV.then=then||null; hideMsg();
}
function frame(dt){
  var h=pen(), c=ST.CHAR.pen, moving=false;
  if(G.started&&!modalOn()){
    var kx0=(MV.keys.r?1:0)-(MV.keys.l?1:0), kz0=(MV.keys.d?1:0)-(MV.keys.u?1:0);
    var th=ST.orbit.th, kx=kx0*Math.cos(th)+kz0*Math.sin(th), kz=-kx0*Math.sin(th)+kz0*Math.cos(th);   /* 矢印は 画面の上下左右（カメラを回しても） */
    if(kx||kz){
      MV.path=null; MV.then=null; var L=Math.hypot(kx,kz), sp=MV.speed*dt;
      var nx=h.position.x+kx/L*sp, nz=h.position.z+kz/L*sp;
      if(free(nx,h.position.z)) h.position.x=nx; if(free(h.position.x,nz)) h.position.z=nz;

var OUTFX=null;
function brightOut(){
  if(OUTFX) return; OUTFX={t:0,hop:0};
  var L=ST.light(), h0=L.hemi.intensity, s0=L.sun.intensity;
  anim(1.2,function(u){ var e=easeOut(u); L.hemi.intensity=h0+(0.92-h0)*e; L.sun.intensity=s0+(0.78-s0)*e; });
  var X0=1.5*RW+0.6, g=new THREE.Group(); ST.scene.add(g); OUTFX.g=g;
  /* 花畑：茎（緑）＋花（5色）。出口から歩く道（z -1.3〜0.3）は あける */
  var cols=[0xff6fa8,0xffd84d,0xffffff,0xff9a3c,0xb58cff], stem=new THREE.CylinderGeometry(0.018,0.018,1,5), head=new THREE.SphereGeometry(1,10,8);
  var stemM=new THREE.MeshLambertMaterial({color:0x4f9a3c}), heads=cols.map(function(c){ return new THREE.MeshLambertMaterial({color:c,emissive:c,emissiveIntensity:0.15}); });
  var seed=7; function rnd(){ seed=(seed*9301+49297)%233280; return seed/233280; }
  for(var i=0;i<90;i++){
    var x=X0+0.4+rnd()*7.5, z=-4.2+rnd()*8.4; if(z>-1.6&&z<0.6&&x<X0+3.2) continue;
    var hgt=0.18+rnd()*0.22, st=new THREE.Mesh(stem,stemM); st.scale.y=hgt; st.position.set(x,hgt/2,z); g.add(st);
    var hd=new THREE.Mesh(head,heads[i%cols.length]); hd.scale.setScalar(0.06+rnd()*0.04); hd.position.set(x,hgt+0.03,z); g.add(hd);
  }
  /* にじ：出口の奥に 7色の半円 */
  var rb=new THREE.Group(); rb.position.set(X0+4.5,0,-9); g.add(rb); OUTFX.rb=rb;
  [0xff4d4d,0xff9a3c,0xffe14d,0x5ed36a,0x4da3ff,0x5560e0,0xa060e0].forEach(function(c,k){
    var m=new THREE.Mesh(new THREE.TorusGeometry(6.6-k*0.26,0.13,8,64,Math.PI),new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:0.6,depthWrite:false,fog:false}));
    rb.add(m); });
  rb.scale.set(0.001,0.001,1);
  anim(1.4,function(u){ var e=1-Math.pow(1-u,3); rb.scale.set(e,e,1); });
}
