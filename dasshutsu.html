   日本語入力で確定した文字を ひらがなにそろえて マスに入れる（カタカナ→ひらがな、半角カナは使わない）。
   入れたら欄は空にもどす。欄が空で Backspace＝1字けす、Enter＝こたえる */
function toHira(t){ return t.replace(/[ァ-ヶ]/g,function(c){ return String.fromCharCode(c.charCodeAt(0)-0x60); }); }
/* ローマ字→ひらがな（2026-10-20 ユーザー指定：答える画面になったら 全角に切りかえたり 欄を押したりしなくても 打てるように）。
   ページから 日本語入力（IME）を オンにはできないので、半角のまま打ったローマ字を ここで ひらがなにする。
   IME がオンなら いままで通り 確定した かなが入る。どちらで打ってもよい */
var ROMA={a:"あ",i:"い",u:"う",e:"え",o:"お",
  ka:"か",ki:"き",ku:"く",ke:"け",ko:"こ",ca:"か",cu:"く",co:"こ",
  sa:"さ",si:"し",shi:"し",su:"す",se:"せ",so:"そ",
  ta:"た",ti:"ち",chi:"ち",tu:"つ",tsu:"つ",te:"て",to:"と",
  na:"な",ni:"に",nu:"ぬ",ne:"ね",no:"の",
  ha:"は",hi:"ひ",hu:"ふ",fu:"ふ",he:"へ",ho:"ほ",
  ma:"ま",mi:"み",mu:"む",me:"め",mo:"も",
  ya:"や",yu:"ゆ",yo:"よ",
  ra:"ら",ri:"り",ru:"る",re:"れ",ro:"ろ",la:"ら",li:"り",lu:"る",le:"れ",lo:"ろ",
  wa:"わ",wo:"を",nn:"ん","n'":"ん",
  ga:"が",gi:"ぎ",gu:"ぐ",ge:"げ",go:"ご",
  za:"ざ",zi:"じ",ji:"じ",zu:"ず",ze:"ぜ",zo:"ぞ",
  da:"だ",di:"ぢ",du:"づ",de:"で",do:"ど",
  ba:"ば",bi:"び",bu:"ぶ",be:"べ",bo:"ぼ",
  pa:"ぱ",pi:"ぴ",pu:"ぷ",pe:"ぺ",po:"ぽ"};
/* 文字列を 先頭から かなにする。{kana: 決まった かなの列, rest: まだ決まらない ローマ字} */
function roma(t){
  var out=[], i=0;
  while(i<t.length){
    var c=t[i];
    if(/[ぁ-ん]/.test(c)){ out.push(c); i++; continue; }
    if(!/[a-z']/.test(c)){ i++; continue; }
    var hit=null;
    for(var L=3;L>=1;L--){ var k=t.substr(i,L); if(k.length===L&&ROMA[k]){ hit=k; break; } }
    if(hit&&!(hit==="n")){ out.push(ROMA[hit]); i+=hit.length; continue; }
    if(c==="n"){
      var nx=t[i+1];
      if(nx===undefined) break;                                    /* n で止まっている → 次の文字を待つ */
      if(!/[aiueoyn']/.test(nx)){ out.push("ん"); i++; continue; }  /* n＋子音 → ん */
    }
    var nx2=t[i+1];
    if(nx2===c&&/[bcdfghjkmpqrstvwxyz]/.test(c)){ out.push("っ"); i++; continue; }   /* kk → っ */
    var pre=false, rest=t.slice(i); for(var key in ROMA){ if(key.indexOf(rest)===0){ pre=true; break; } }
    if(pre) break;                                                 /* 打ちかけ（sh など）→ 次の文字を待つ */
    i++;                                                           /* ローマ字にならない文字は すてる */
  }
  return {kana:out, rest:t.slice(i)};
}
function bindKb(inp){
  if(!inp) return;
  var comp=false;
  function take(final){ if(comp) return;
    var t=toHira(inp.value.normalize("NFKC")).toLowerCase(); if(final&&/n$/.test(t)) t+="n";   /* 最後の n は ん にする */
    var r=roma(t); r.kana.forEach(function(ch){ put(ch); }); inp.value=final?"":r.rest; }
  inp.addEventListener("compositionstart",function(){ comp=true; });
  inp.addEventListener("compositionend",function(){ comp=false; setTimeout(function(){ take(false); },0); });
  inp.addEventListener("input",function(e){ if(!e.isComposing) take(false); });
  inp.addEventListener("keydown",function(e){
    if(e.isComposing||e.keyCode===229) return;
    if(e.key==="Enter"){ e.preventDefault(); take(true); check(); }
    else if(e.key==="Backspace"&&!inp.value){ e.preventDefault(); if(MP){ MP.val.pop(); drawSlots(); } }
    else if(e.key==="Escape"){ closeMemo(); }
    e.stopPropagation();
  });
  /* 開いたら すぐ 打てるように 欄に入っておく。表のボタンを押しても 欄から ぬけない（ボタンが フォーカスを取らない） */
  setTimeout(function(){ try{ inp.focus({preventScroll:true}); }catch(e){} },60);
  var memo=$("memo");
  memo.querySelectorAll("button").forEach(function(b){ b.addEventListener("mousedown",function(ev){ ev.preventDefault(); }); });
}
function put(ch){ if(!MP||MP.val.length>=MP.n) return; SFX.key(); MP.val.push(ch); drawSlots(); }
function setAnswer(t){ if(!MP) return; MP.val=t.split("").slice(0,MP.n); drawSlots(); }
function drawSlots(){ var s=$("memo").querySelectorAll(".slot"); for(var i=0;i<s.length;i++){ s[i].textContent=MP.val[i]||""; s[i].className="slot"+(i===MP.val.length?" cur":""); } }
function check(){
  var el=$("memo"), mp=el.querySelector(".mp"), r=el.querySelector(".res"), v=MP.val.join("");
  if(v.length<MP.n){ r.className="res ng"; r.textContent=MP.n+"文字 入れてね"; return; }
  if(v===MP.cfg.answer){
    SFX.clear(); r.className="res ok"; r.innerHTML="⭕ 解けた！ 「"+v+"」";
    el.querySelectorAll(".slot").forEach(function(s){ s.classList.add("ok"); });
    mp.classList.remove("tada"); void mp.offsetWidth; mp.classList.add("tada");
    if(!REDUCE) ST.FX.confetti(110);          /* 解けたら 花吹雪（2026-10-20 ユーザー指定） */
    var f=MP.cfg.onOK; setTimeout(function(){ closeMemo(); f(); },REDUCE?200:1100);
  } else {
    SFX.ng(); r.className="res ng"; r.textContent="❌ ちがうみたい。もう一度 考えよう";
    wrong(mp);
  }
}
/* まちがえたとき（2026-10-20 ユーザー指定：不正解でも 画面が少しゆれるなどの演出がほしい）
   motion-ref error-shake：メモ帳を X 0→-12→10→-6→4→0・540ms easeOutExpo、答えのマスを赤く。
   あわせて 画面のふちが赤く光る（同じ 540ms）・3D の画面が少しゆれる・ペンギンが しょんぼり */
function wrong(mp){

      (hasK?'<div class="row" style="margin-top:6px"><button class="usekey" data-k="key">🔑 鍵（'+K5T+'）を 使う</button><small>1文字目は '+K5[0]+'つ、2文字目は '+K5[1]+'つ… もどす</small></div>':'<div class="row" style="margin-top:6px"><small>この暗号の <b>鍵</b>（ずらす数の ならび）が あれば…。どこかに かくされているはず。</small></div>'),
    bindTool:function(el){
      var num=el.querySelector(".num"), pv=el.querySelector(".prev");
      el.querySelectorAll(".dial button").forEach(function(b){ b.onclick=function(){ n=(n+(+b.getAttribute("data-d"))+46)%46; SFX.key(); num.textContent=n; pv.textContent=shiftT(C5,[n],-1); }; });
      var kb=el.querySelector("[data-k=key]");
      if(kb) kb.onclick=function(){ SFX.scramble(); kb.disabled=true; scrambleTo(pv,ANS.q5,function(){ setAnswer(ANS.q5); var r=el.querySelector(".res"); r.className="res ok"; r.innerHTML="🔑 鍵を 知っていれば <b>一瞬</b>！（知らなければ "+combos(ANS.q5.length).oku+"通り）"; }); };
    },
    onOK:function(){ unlockDoor(2,W.padEscr); }});
}
/* 文字のざわざわ（tx-scramble-decode：1s・25fps・0.5s 遅れて左から確定） */
var NOISE="あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをん";
function scrambleTo(el,to,done){
  if(REDUCE){ el.textContent=to; done(); return; }
  var t0=performance.now(), n=to.length;
  (function f(){ var u=Math.min(1,(performance.now()-t0)/1000), s="";
    for(var i=0;i<n;i++) s+=(u>=0.5+0.5*(i/n))?to[i]:NOISE[(Math.random()*46)|0];
    el.textContent=s; if(u<1) setTimeout(f,40); else { el.textContent=to; done(); } })();
}

/* ---------- ヒント ---------- */
function goal(){
  var f=G.f;
  if(hard()) return goalHard();
  if(!f.q1) return {id:"q1",target:"posterA",h:["かべの <b>はり紙</b>を 調べてみよう。","たぬきの絵…「た」を <b>ぬく</b> と？","答えは「<b>ほんだな</b>」。た を ぬいて 読む。"]};
  if(!f.memo) return {id:"shelf",target:"shelf",h:["「ほんだな」…<b>本だな</b>を 調べよう。"]};
  if(!f.doorA) return {id:"q2",target:"padA",h:["本だなの <b>メモ</b>を見て、扉の 文字錠を 調べよう。","メモの文字を <b>うしろから</b> 読んでみよう。","答えは「<b>ねこのす</b>」。"]};
  if(!has("key3")) return {id:"key3",target:"desk",h:["作戦室の <b>机</b>を 調べてみよう。"]};
  if(!f.note) return {id:"note2",target:"note2",h:["作戦室の <b>ノート</b>を 調べよう。","あいうえお順に "+Q.ex+"つ すすめる。か→き→<b>く</b>。","答えは「<b>"+shiftT(Q.exw,[Q.ex],1)+"</b>」。"]};
  if(!f.q3) return {id:"q3",target:"board",h:["<b>作戦ボード</b>の 暗号を 調べよう。","鍵の数字は <b>3</b>。五十音（あいうえお かきくけこ…）で <b>3つ 前</b>に もどす。な の3つ前は と→て→<b>つ</b>。","答えは「<b>つくえ</b>」。"]};
  if(!f.drawer) return {id:"drawer",target:"desk",h:["「つくえ」…<b>机</b>を もう一度 調べよう。"]};
  if(!f.q4) return {id:"q4",target:"desk",h:["持ち物の <b>カード</b>を 押して、暗号を 見よう。","鍵が ないので、<b>ダイヤル</b>を 1から 順に 回して、読める言葉を さがそう。","答えは「<b>ほしのえ</b>」（"+Q.k4+"つ ずらしてあった）。"]};
  if(!f.poster) return {id:"star",target:"star",h:["「ほしのえ」…かべの <b>星の絵</b>を 調べよう。"]};
  if(!f.doorB) return {id:"reader",target:"reader",h:["<b>カードキー</b>を、扉の横の 読み取り機で 使おう。"]};
  if(!f.rug&&!f.safe) return {id:"q5a",target:"padE",h:["出口の あいことばは 1文字ごとに ずらす数が ちがう。ダイヤルでは 解けない。","この暗号の <b>鍵</b>が どこかに かくされている。<b>金庫</b>が あやしい。","金庫の ばんごうの 手がかりは… <b>しきもの</b>の下を 見てみよう。"]};
  if(!f.safe) return {id:"safe",target:"safe",h:["メモ：「金庫の ばんごうは <b>とけいが しっている</b>」。","かべの <b>時計</b>は "+Q.clock+"。","金庫の ばんごうは「<b>"+Q.safe.split("").join("・")+"</b>」。"]};
  if(!f.exit) return {id:"q5",target:"padE",h:["金庫の <b>鍵（"+K5T+"）</b>を使って、<b>出口の 文字錠</b>の 暗号を 解こう。"]};
  return null;
}
/* むずかしいの ヒント（さいごの段＝答えは 出さない。hintList が 切る） */
function goalHard(){
  var f=G.f;
  if(!f.q1) return {id:"q1",target:"posterA",h:["かべの <b>はり紙</b>を 調べてみよう。","たぬき＝「た」を <b>ぬく</b>。でも たぬきは <b>さかだち</b> している…","答え"]};
  if(!f.memo) return {id:"memo",target:"crate",h:["「きばこ」…<b>木箱</b>を 調べよう。"]};
  if(!f.doorA) return {id:"q2",target:"padA",h:["木箱の <b>メモ</b>を見て、扉の 文字錠を 調べよう。","うさぎは ぴょんぴょん <b>1つ とばし</b>。1文字目・3文字目・5文字目…","答え"]};
  if(!has("key3")) return {id:"key3",target:"desk",h:["作戦室の <b>机</b>を 調べてみよう。"]};
  if(!f.note) return {id:"note2",target:"note2",h:["作戦室の <b>ノート</b>を 調べよう。","あいうえお順に "+Q.ex+"つ すすめる。","答え"]};
  if(!f.q3) return {id:"q3",target:"board",h:["<b>作戦ボード</b>の 暗号を 調べよう。","鍵の数字は <b>"+Q.k3+"</b>。五十音で <b>"+Q.k3+"つ 前</b>に もどす。","答え"]};
  if(!f.drawer) return {id:"drawer",target:"desk",h:["「いす」…机の <b>いす</b>を 調べよう。"]};
  if(!f.q4) return {id:"q4",target:"desk",h:["持ち物の <b>カード</b>を 押して、暗号を 見よう。","<b>ダイヤル</b>を 回して、読める言葉を さがそう。","答え"]};
  if(!f.poster) return {id:"neon",target:"neon",h:["「ねおん」…<b>ネオンの看板</b>を 調べよう。"]};
  if(!f.doorB) return {id:"reader",target:"reader",h:["<b>カードキー</b>を、扉の横の 読み取り機で 使おう。"]};
  if(!f.rug&&!f.safe) return {id:"q5a",target:"padE",h:["出口の あいことばは 1文字ごとに ずらす数が ちがう。","この暗号の <b>鍵</b>は <b>金庫</b>の中？ 金庫の ばんごうの 手がかりを さがそう。","答え"]};
  if(!f.safe) return {id:"safe",target:"safe",h:["メモの 暗号を <b>2つ もどす</b>と、数の 読み方に なる。","「ろく」「に」「さん」…","答え"]};
  if(!f.exit) return {id:"q5",target:"padE",h:["金庫の <b>鍵（"+K5T+"）</b>を使って、<b>出口の 文字錠</b>の 暗号を 解こう。"]};
  return null;
}
/* ヒントのボタン（2026-10-20 ユーザー指定：1分ほどたったら出す）。進んだら（prog）また隠して、次の謎で 1分 */
/* ヒントは 時間がたつと 1段ずつ 見られる（2026-10-21 ユーザー指定：30秒ごとに ヒント1・ヒント2・ヒント3…）。
   最後に進んでから（prog）ふつう 30秒ごと／むずかしい 60秒ごとに 1段ふえる。むずかしいは さいごの段（答え）は出さない。
   1段目が見られるようになったら ボタンが出る。段がふえるたびに ボタンの数字がふえて ぽんと はねる */
var HINT_STEP=30000, HINT_STEP_HARD=60000;
function hintList(g){ return (G.level==="hard"&&g.h.length>1)?g.h.slice(0,-1):g.h; }
function hintStep(){ return G.level==="hard"?HINT_STEP_HARD:HINT_STEP; }
function hintOpen(g){ return Math.min(hintList(g).length,Math.floor((performance.now()-G.lastProg)/hintStep())); }   /* いま見られる段の数 */
function hintTick(){
  var g=goal(); if(!g){ if(G.hintOn) hintBtn(false); return; }
  var n=hintOpen(g);
  if(n>=1&&!G.hintOn) hintBtn(true);
  if(G.hintOn&&n!==G.hintN){ G.hintN=n; var b=$("bHint"); b.innerHTML='💡 ヒント<small>'+n+'</small>';
    if(n>1&&!REDUCE&&b.animate){ b.animate([{transform:"scale(1)"},{transform:"scale(1.18)",offset:0.4},{transform:"scale(1)"}],{duration:420,easing:"cubic-bezier(.34,1.56,.64,1)"}); SFX.pop(); } }
}
function hintBtn(on){
  G.hintOn=on; G.hintN=0; var b=$("bHint"); if(!b) return;
  if(on){ b.style.display=""; if(!REDUCE&&b.animate) b.animate([{transform:"scale(.05)",opacity:0},{transform:"scale(1.16)",opacity:1,offset:0.72},{transform:"scale(1)",opacity:1}],{duration:520,easing:"cubic-bezier(.34,1.56,.64,1)"}); SFX.ok(); }   /* motion-ref pop-scale 520ms */
  else b.style.display="none";
}
function hint(){
  if(!G.started||G.tEnd) return;
  var g=goal(); if(!g) return;
  var H=hintList(g), n=hintOpen(g); if(n<1) return;          /* まだ 1段も 開いていない */
  var seen=G.hintLv[g.id]||0; if(n>seen){ G.hints+=n-seen; G.hintLv[g.id]=n; }        /* 見た段の数（クリア画面に出す） */
  var html=H.slice(0,n).map(function(t,i){ return '<div class="hl"><span class="hn">💡 ヒント'+(i+1)+'</span>'+t+'</div>'; }).join("");
  if(n<H.length) html+='<div class="hl lock"><span class="hn">ヒント'+(n+1)+'</span>🔒 まだ 見られない</div>';   /* 残り時間は出さない（2026-10-21 ユーザー指定） */
  msg(html,[{t:"とじる",sub:true}]);
  if(HS[g.target]) point([].concat(HS[g.target].obj)[0],true);
}

/* ---------- はじめ・おわり ---------- */
/* スタート画面（2026-10-20 ユーザー指定：「脱出ゲーム」のタイトル＋難易度「かんたん・ふつう・むずかしい」）。
   いまあるのは「ふつう」だけ。かんたん・むずかしいは あとで作る（ボタンは「じゅんび中」で押せない）。
   作るときは LEVELS に足して、G.level で 謎・ヒントを切りかえる */
var LEVELS=[{id:"normal",n:"ふつう",d:"暗号 5問・約10分",ready:true},{id:"hard",n:"むずかしい",d:"問題が ちがう・光る印なし",ready:true}];
function startCard(){
  ST.card('<div class="ttl">脱出ゲーム</div><div class="big">🐧 猫のアジトから 脱出せよ！</div>'+
    '<div class="lead">悪い猫の アジトに 閉じこめられた！ <b>暗号を 解いて</b> 脱出しよう。</div>'+
    '<div class="ops">歩く <kbd>←↑↓→</kbd>／床を クリック　調べる <kbd>Enter</kbd>／クリック　回す ドラッグ</div>'+
    '<div class="lvh">むずかしさを えらぶ</div><div class="lv">'+LEVELS.map(function(L){ return '<button class="lvb'+(L.ready?'':' off')+'"'+(L.ready?' id="'+(L.id==="normal"?"bStart":"lv_"+L.id)+'"':' disabled')+'><b>'+L.n+'</b><small>'+(L.ready?L.d:'じゅんび中')+'</small></button>'; }).join("")+'</div>');
  /* ふつう（既定。Enter でも）／むずかしい（2026-10-20）。
     むずかしい＝調べる物のきらめき・次に行く物の青い縁どり・1分後の縁どり なし／ヒントは 2分たってから・答えの段は出さない／はじめの一言も 手がかりなし。
     暗号5問と 部屋は ふつうと同じ（10分の導入のまま） */
  function begin(level){ SFX.click(); ST.hideCard(); G.level=level; setQ(level); repaintQ();
    /* はじめに 操作のしかた（約20秒。howto.js）。見おわって「はじめる」で 時計が動きだす。?test=1 では出さない（?howto=1 なら出す） */
    var q=new URLSearchParams(location.search);
    go(); if(window.HOWTO&&(!ST.TEST||q.get("howto"))) HOWTO.open();   /* 2026-10-21：すぐ遊べる。操作のしかたは 右に小さく（約20秒・調べたら消える） */
    function go(){ G.started=true; G.t0=performance.now(); G.lastProg=G.t0;
    msg(level==="hard"?'<span class="pen">ペンギン</span>「ここは どこ…？ 扉には 鍵が かかっている…」':'<span class="pen">ペンギン</span>「ここは どこ…？ 扉には 鍵が かかっている。<b>かべの はり紙</b>が 気になる…」'); } }
  $("bStart").onclick=function(){ begin("normal"); };
  /* クリア画面の「むずかしいに挑戦」から来たら、そのまま むずかしいで 始める（読みなおしで くり返さないよう 印は消す） */
  var qs=new URLSearchParams(location.search);
  if(qs.get("go")==="hard"){ qs.delete("go"); try{ history.replaceState(null,"",location.pathname+(qs.toString()?"?"+qs.toString():"")); }catch(e){} setTimeout(function(){ begin("hard"); },0); }
  if($("lv_hard")) $("lv_hard").onclick=function(){ begin("hard"); };
}
function escape(){
  G.tEnd=performance.now(); hideMsg();
  var hp=pen().position; MV.path=astar(hp.x,hp.z,1.5*RW+1.75,-0.5)||[new V3(1.5*RW+1.75,0,-0.5)]; MV.then=function(){
    var s=Math.round((G.tEnd-G.t0)/1000);
    if(!REDUCE) ST.FX.confetti(140); SFX.clear();
    ST.card('<div class="big">🎉 脱出 成功！</div>'+
      '<div class="stat"><div>'+(G.level==="hard"?"むずかしい":"ふつう")+'<small>むずかしさ</small></div><div>'+Math.floor(s/60)+'分'+String(s%60).padStart(2,"0")+'秒<small>かかった時間</small></div><div>'+G.hints+'回<small>ヒントを見た</small></div></div>'+
      '<div class="plan">😼 計画書に 書いてあった 一味の ねらい：<br><b>ペンギンが モグラに 送る手紙を、ネットで ぬすみ見る！</b></div>'+
      '<div class="lead" style="margin-top:8px">さいごの暗号は、<b>鍵</b>（ずらす数の ならび）を 知らないと '+combos(ANS.q5.length).oku+'通り。鍵を 知っていれば 一瞬だった。<br>手紙を 悪者から 守るには… ？</div>'+
      (G.level==="hard"?'<button class="go" id="bAgain">もう一度 あそぶ</button>'
        :'<div class="clbt"><button class="go hard" id="bHard">🔥「むずかしい」に 挑戦 ▶</button><button class="go sub" id="bAgain">もう一度 ふつう</button></div>'));
    var c=$("card"); c.classList.remove("tada"); void c.offsetWidth; if(!REDUCE&&c.animate) c.animate([{transform:"translate(-50%,-50%) scale(.9)"},{transform:"translate(-50%,-50%) scale(1.05)",offset:0.5},{transform:"translate(-50%,-50%) scale(1)"}],{duration:1000,easing:"ease-out"});
    $("bAgain").onclick=function(){ location.reload(); };
    /* むずかしいに 挑戦：読みなおして すぐ むずかしいで 始める（?go=hard。2026-10-21 ユーザー指定） */
    if($("bHard")) $("bHard").onclick=function(){ SFX.click(); var q=new URLSearchParams(location.search); q.set("go","hard"); location.search=q.toString(); };
  };
}

/* ---------- キー操作 ---------- */
var KEYMAP={ArrowUp:"u",KeyW:"u",ArrowDown:"d",KeyS:"d",ArrowLeft:"l",KeyA:"l",ArrowRight:"r",KeyD:"r"};
document.addEventListener("keydown",function(e){
  if(e.target&&e.target.classList&&e.target.classList.contains("kb")) return;
  if($("memo").classList.contains("on")){ if(e.key==="Escape") closeMemo(); else if(MP&&!MP.safe&&e.key==="Backspace"){ MP.val.pop(); drawSlots(); e.preventDefault(); } else if(MP&&!MP.safe&&e.key==="Enter"){ check(); e.preventDefault(); } return; }
  if($("card").classList.contains("on")){ if(e.key==="Enter"){ var b=$("bStart")||$("bHard")||$("bAgain"); if(b){ b.click(); e.preventDefault(); } } return; }
  var k=KEYMAP[e.code]; if(k){ MV.keys[k]=true; e.preventDefault(); return; }
  if((e.key==="Enter"||e.key===" ")&&nearId){ e.preventDefault(); var o=HS[nearId]; hideMsg(); examine(o); }
});
document.addEventListener("keyup",function(e){ var k=KEYMAP[e.code]; if(k) MV.keys[k]=false; });
window.addEventListener("blur",function(){ MV.keys={}; });

/* ---------- 起動 ---------- */
ST.init({build:build,indoor:true,fixedCam:true,plants:{inner:12,outer:30,zScale:0.75,trees:40,bushes:22,avoid:[{x:0,z:0,r:12.5},{x:1.5*RW+1.4,z:0,r:3},{x:1.5*RW+4.5,z:5,r:5.5}]   /* 外に出たときの カメラの前に 木を置かない */}});
showRoom("A");
roomLabel(); drawInv(); hintBtn(false);
$("near").onclick=function(){ if(nearId){ examine(HS[nearId]); } };
$("bHint").onclick=function(){ SFX.click(); hint(); };
$("bCamR").onclick=function(){ SFX.click(); ST.resetOrbit(); };
function setSnd(){ var b=$("bSound"); b.innerHTML=LOOK.icon(ST.SET.sound?"snd":"mute"); b.classList.toggle("off",!ST.SET.sound); }
$("bSound").addEventListener("click",function(){ ST.SET.sound=!ST.SET.sound; ST.saveSet(); setSnd(); SFX.click(); }); setSnd();
/* ホームへ（2026-10-21 ユーザー指定：右上にホーム画面へ戻るボタン）。遊んでいる途中なら 一度たずねる（進んだところは消える）。
   ホーム＝スタート画面。ページを読みなおして はじめから */
$("bHome").onclick=function(){ SFX.click();
  if(!G.started||G.tEnd){ location.reload(); return; }
  msg('🏠 ホーム画面に もどる？ <small>ここまで 進んだところは 消えます。</small>',[{t:"もどる",fn:function(){ location.reload(); }},{t:"つづける",sub:true}]); };
startCard();
if(ST.TEST){
  window.__G=G; window.__HS=HS; window.__go=go; window.__pen=pen; window.__MP=function(){ return MP; }; window.__ANS=ANS;
  window.__run=function(sec){ for(var i=0;i<sec*30;i++) ST.step(1/30); };
  window.__answer=function(t){ setAnswer(t); check(); };
  window.__safe=function(){ closeMemo(); openSafe(); };
}
})();
</script>
